<script>
const SHEET_ID = "1jjguKLQE4dI76DBIbEw4ppxG26Ld8Eq7_cvbqFYU7Yo";
const SHEET_NAME = "JMCUP";

let TOURNAMENT_ROWS = [];
let MATCHES = [];
let currentView = "table";
let currentTeam = "전체";
let calendarMonths = [];
let currentCalendarIndex = 0;

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, s => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[s]));
}

function sheetUrl(){
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
}

function normalizeDate(value){
  const raw = String(value || "").trim();
  if(!raw) return "";

  // 구글시트/엑셀 날짜 숫자 처리
  if(/^\d+(\.\d+)?$/.test(raw)){
    const serial = Number(raw);
    const utcDays = Math.floor(serial - 25569);
    const utcValue = utcDays * 86400 * 1000;
    const date = new Date(utcValue);

    const y = date.getUTCFullYear();
    const m = String(date.getUTCMonth() + 1).padStart(2, "0");
    const d = String(date.getUTCDate()).padStart(2, "0");

    return `${y}-${m}-${d}`;
  }

  const parts = raw.match(/\d+/g);
  if(!parts || parts.length < 3) return raw;

  const y = parts[0];
  const m = String(parts[1]).padStart(2, "0");
  const d = String(parts[2]).padStart(2, "0");

  return `${y}-${m}-${d}`;
}

async function loadTournamentSheet(){
  const res = await fetch(sheetUrl());

  if(!res.ok){
    throw new Error("JMCUP 시트를 불러오지 못했습니다.");
  }

  const csvText = await res.text();
  const workbook = XLSX.read(csvText, { type:"string" });
  const sheet = workbook.Sheets[workbook.SheetNames[0]];

  TOURNAMENT_ROWS = XLSX.utils.sheet_to_json(sheet, { defval:"" });

buildMatches();
buildCalendarMonths();
renderTeamFilter();
renderCalendar();
renderMatchList();
renderGroupStanding();
renderBracket();
renderTeamView();
renderPowerRanking();
}

function toBool(value){
  return value === true || ["TRUE", "1", "Y", "YES"].includes(String(value ?? "").trim().toUpperCase());
}

function numOrBlank(value){
  const raw = String(value ?? "").trim();
  if(raw === "") return null;
  const n = Number(raw.replace(/,/g, ""));
  return Number.isFinite(n) ? n : null;
}

function getPlayerEntryInfo(playerName){
  const target = String(playerName || "").trim();
  if(!target || target === "미정") return { tier:"", race:"" };

  const row = TOURNAMENT_ROWS.find(r =>
    String(r["이름"] || "").trim() === target
  );

  return {
    tier: String(row?.["티어"] || "").trim(),
    race: String(row?.["종족"] || "").trim()
  };
}

function buildMatches(){
  const map = new Map();

  TOURNAMENT_ROWS.forEach((row, rowIndex) => {
    if(!row["화면구분"] && !row["경기명"] && !row["MatchID"]) return;

    const matchId = String(row["MatchID"] || "").trim();
    const fallbackKey = [
      row["화면구분"], row["경기구분"], row["조"], row["라운드"],
      row["경기명"], row["날짜"], row["시간"], row["팀A"], row["팀B"]
    ].join("|");
    const matchKey = matchId || fallbackKey;

    if(!map.has(matchKey)){
      map.set(matchKey, {
        key: matchKey,
        MatchID: matchId,
        화면구분: row["화면구분"], 경기구분: row["경기구분"],
        조: row["조"], 라운드: row["라운드"], 경기명: row["경기명"],
        날짜: normalizeDate(row["날짜"]), 원본날짜: row["날짜"], 시간: row["시간"],
        상태: row["상태"], 팀A: row["팀A"], 팀B: row["팀B"],
        점수A: row["점수A"], 점수B: row["점수B"], 승리팀: row["승리팀"],
        sets: [], _rowIndex: rowIndex
      });
    }

    const match = map.get(matchKey);
    // 같은 MatchID의 뒤쪽 행에만 값이 있어도 보완
    ["화면구분","경기구분","조","라운드","경기명","시간","상태","팀A","팀B","승리팀"].forEach(k => {
      if(!match[k] && row[k] !== "") match[k] = row[k];
    });
    if(!match.점수A && row["점수A"] !== "") match.점수A = row["점수A"];
    if(!match.점수B && row["점수B"] !== "") match.점수B = row["점수B"];

    const setNo = numOrBlank(row["세트"]);
    const hasSetData = setNo !== null || row["세트A선수"] || row["세트B선수"] || row["세트승자"];
    if(!hasSetData) return;

    const playerAName = String(row["세트A선수"] || "").trim();
    const playerBName = String(row["세트B선수"] || "").trim();
    const playerAInfo = getPlayerEntryInfo(playerAName);
    const playerBInfo = getPlayerEntryInfo(playerBName);

    match.sets.push({
      세트: setNo ?? row["세트"],
      세트A: playerAName,
      세트B: playerBName,
      세트승자: String(row["세트승자"] || "").trim(),
      세트승리팀: String(row["세트승리팀"] || "").trim(),
      맵: row["맵"],
      팀A점수전: numOrBlank(row["팀A점수(전)"]),
      팀B점수전: numOrBlank(row["팀B점수(전)"]),
      에이스전: toBool(row["에이스전"]),

      // 상세 엔트리의 티어/종족은 우측 선수 목록(이름/종족/티어)에서 자동 조회
      // 기존 전용 컬럼이 있으면 그 값을 우선 사용하고, 없으면 선수 목록 값을 사용
      세트A티어: String(row["선수A티어"] || playerAInfo.tier || "").trim(),
      세트A종족: String(row["선수A종족"] || playerAInfo.race || "").trim(),
      세트B티어: String(row["선수B티어"] || playerBInfo.tier || "").trim(),
      세트B종족: String(row["선수B종족"] || playerBInfo.race || "").trim(),

      세트A비고: row["선수A비고"] || "",
      세트B비고: row["선수B비고"] || "",
      홈픽: row["선수A비고"] || "",
      원정픽: row["선수B비고"] || "",
      _rowIndex: rowIndex
    });
  });

  MATCHES = [...map.values()].map(match => {
    match.sets.sort((a,b) => {
      const an = Number(a.세트), bn = Number(b.세트);
      if(Number.isFinite(an) && Number.isFinite(bn)) return an - bn;
      return a._rowIndex - b._rowIndex;
    });
    return match;
  }).sort((a, b) => {
    if(a.날짜 !== b.날짜) return String(a.날짜).localeCompare(String(b.날짜));
    const timeA = String(a.시간 || "").trim();
    const timeB = String(b.시간 || "").trim();
    const fixedA = /^\d{1,2}:\d{2}$/.test(timeA);
    const fixedB = /^\d{1,2}:\d{2}$/.test(timeB);
    if(fixedA && !fixedB) return -1;
    if(!fixedA && fixedB) return 1;
    if(fixedA && fixedB) return timeA.localeCompare(timeB);
    return a._rowIndex - b._rowIndex;
  });
}

function buildCalendarMonths(){
  const validDates = MATCHES
    .map(m => m.날짜)
    .filter(Boolean)
    .sort();

  if(!validDates.length){
    calendarMonths = [];
    return;
  }

  const first = validDates[0].slice(0, 7);
  const last = validDates[validDates.length - 1].slice(0, 7);

  const [startY, startM] = first.split("-").map(Number);
  const [endY, endM] = last.split("-").map(Number);

  calendarMonths = [];

  let y = startY;
  let m = startM;

  while(y < endY || (y === endY && m <= endM)){
    calendarMonths.push({
      year: y,
      month: m
    });

    m++;

    if(m > 12){
      m = 1;
      y++;
    }
  }

  currentCalendarIndex = 0;
}

function renderCalendar(){
  const box = document.getElementById("calendarGrid");

  if(!MATCHES.length){
    box.innerHTML = `<div class="tournament-empty">등록된 일정이 없습니다.</div>`;
    return;
  }

  if(!calendarMonths.length){
    buildCalendarMonths();
  }

  const current = calendarMonths[currentCalendarIndex];

  if(!current){
    box.innerHTML = `<div class="tournament-empty">날짜 형식을 확인해주세요.</div>`;
    return;
  }

  const year = current.year;
  const month = current.month;

  const firstDay = new Date(year, month - 1, 1);
  const lastDate = new Date(year, month, 0).getDate();
  const startDay = firstDay.getDay();

  const monthTitle = `${year}.${String(month).padStart(2, "0")}`;

  let html = `
    <div class="jm-calendar">
<div class="jm-calendar-nav">
  <button id="calendarPrevBtn" ${currentCalendarIndex === 0 ? "disabled" : ""}>
  <span class="calendar-arrow">‹</span>
</button>
  <div class="jm-calendar-title">${monthTitle}</div>
  <button id="calendarNextBtn" ${currentCalendarIndex === calendarMonths.length - 1 ? "disabled" : ""}>
  <span class="calendar-arrow">›</span>
</button>
</div>

      <div class="jm-calendar-week">
        <div class="sun">일</div>
        <div>월</div>
        <div>화</div>
        <div>수</div>
        <div>목</div>
        <div>금</div>
        <div class="sat">토</div>
      </div>

      <div class="jm-calendar-days">
  `;

  for(let i = 0; i < startDay; i++){
    html += `<div class="jm-day empty"></div>`;
  }

  for(let day = 1; day <= lastDate; day++){
    const dateKey = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    const dayMatches = MATCHES.filter(m => m.날짜 === dateKey);

    html += `
      <div class="jm-day">
        <div class="jm-day-num">${day}</div>
        ${dayMatches.map(m => `
          <button class="jm-calendar-event" data-key="${esc(m.key)}">
            ${esc(m.시간 || "미정")} ${esc(m.경기명 || m.라운드)}<br>
${esc(m.팀A || "미정")} vs ${esc(m.팀B || "미정")}
          </button>
        `).join("")}
      </div>
    `;
  }

  html += `
      </div>
    </div>
  `;

  box.innerHTML = html;

  document.getElementById("calendarPrevBtn")?.addEventListener("click", () => {
    if(currentCalendarIndex <= 0) return;
    currentCalendarIndex--;
    renderCalendar();
  });

  document.getElementById("calendarNextBtn")?.addEventListener("click", () => {
    if(currentCalendarIndex >= calendarMonths.length - 1) return;
    currentCalendarIndex++;
    renderCalendar();
  });

  document.querySelectorAll(".jm-calendar-event").forEach(btn => {
    btn.addEventListener("click", () => {
      switchView("table");

      const target = MATCHES.find(m => m.key === btn.dataset.key);
      if(!target) return;

      currentTeam = "전체";
      renderMatchList(target.key);
    });
  });
}

function renderGroupStanding(){

  const box = document.getElementById("groupStandingBox");
  if(!box) return;

  const groups = {};

  const realTeams = new Set(
    getTeamList().map(team => team.name)
  );

  MATCHES.forEach(match => {
    if(match.화면구분 !== "조별예선") return;

    const group = String(match.조 || "기타").trim();
    if(!groups[group]) groups[group] = {};

    const teamA = String(match.팀A || "").trim();
    const teamB = String(match.팀B || "").trim();

    const hasTeamA = realTeams.has(teamA);
    const hasTeamB = realTeams.has(teamB);

    if(!hasTeamA && !hasTeamB) return;

    if(hasTeamA && !groups[group][teamA]){
      groups[group][teamA] = {
        team: teamA,
        games:0,
        win:0,
        lose:0,
        gf:0,
        ga:0,
        gd:0,
        points:0
      };
    }

    if(hasTeamB && !groups[group][teamB]){
      groups[group][teamB] = {
        team: teamB,
        games:0,
        win:0,
        lose:0,
        gf:0,
        ga:0,
        gd:0,
        points:0
      };
    }

    const aScore = Number(match.점수A || 0);
    const bScore = Number(match.점수B || 0);
    const isFinished = String(match.상태 || "").trim() === "종료";

    // 종료 경기는 실제 점수를 기준으로 승리팀을 판정한다.
    // 시트의 승리팀 값은 점수로 판정할 수 없는 경우에만 보조적으로 사용한다.
    let winTeam = "";

    if(isFinished){
      if(aScore > bScore){
        winTeam = teamA;
      }else if(bScore > aScore){
        winTeam = teamB;
      }
    }

    if(!winTeam){
      const sheetWinner = String(match.승리팀 || "").trim();
      if(sheetWinner === teamA || sheetWinner === teamB){
        winTeam = sheetWinner;
      }
    }

    const hasResult =
      isFinished &&
      winTeam &&
      winTeam !== "미정";

if(hasResult){

  if(hasTeamA){
    groups[group][teamA].games++;
    groups[group][teamA].gf += aScore;
    groups[group][teamA].ga += bScore;
    groups[group][teamA].gd =
      groups[group][teamA].gf - groups[group][teamA].ga;
  }

  if(hasTeamB){
    groups[group][teamB].games++;
    groups[group][teamB].gf += bScore;
    groups[group][teamB].ga += aScore;
    groups[group][teamB].gd =
      groups[group][teamB].gf - groups[group][teamB].ga;
  }

}

    if(hasResult && hasTeamA && winTeam === teamA){
      groups[group][teamA].win++;
      groups[group][teamA].points += 5;

      if(hasTeamB){
        groups[group][teamB].lose++;
      }
    }

    if(hasResult && hasTeamB && winTeam === teamB){
      groups[group][teamB].win++;
      groups[group][teamB].points += 5;

      if(hasTeamA){
        groups[group][teamA].lose++;
      }
    }
  });

  const groupOrder = ["A조", "B조", "C조", "D조"];

  const visibleGroups = groupOrder.filter(group => {
    const teams = groups[group] || {};
    return Object.keys(teams).length > 0;
  });

  if(visibleGroups.length === 0){
    box.innerHTML = `
      <div class="tournament-empty">
        <center><h3>조 추첨이 이루어지지 않았습니다.</h3></center>
      </div>
    `;
    return;
  }

  box.innerHTML = visibleGroups.map(group => {

    const teams = groups[group] || {};

    const ranking = Object.values(teams).sort((a,b) => {
      if(b.points !== a.points) return b.points - a.points;
      if(b.win !== a.win) return b.win - a.win;
      if(b.gd !== a.gd) return b.gd - a.gd;
      if(b.gf !== a.gf) return b.gf - a.gf;
      return a.team.localeCompare(b.team);
    });

    return `
      <div class="group-standing-card">
        <table class="group-standing-table">
          <thead>
            <tr>
              <th>${esc(group)}</th>
              <th>경기</th>
              <th>W</th>
              <th>L</th>
              <th>득점</th>
              <th>실점</th>
              <th>득실</th>
              <th>승점</th>
            </tr>
          </thead>

          <tbody>
            ${ranking.map((team, idx) => `
              <tr>
                <td class="standing-team-cell">
                  <div class="standing-team-inner">
                    <span class="standing-rank">${idx + 1}위</span>

                    ${
                      getTeamLogo(team.team)
                        ? `<img class="standing-team-logo" src="${getTeamLogo(team.team)}" alt="${esc(team.team)}">`
                        : `<span class="standing-team-logo empty"></span>`
                    }

                    <span class="standing-team-name">${esc(team.team)}</span>
                  </div>
                </td>

                <td>${team.games}</td>
                <td>${team.win}</td>
                <td>${team.lose}</td>
                <td>${team.gf}</td>
                <td>${team.ga}</td>
                <td>${team.gd > 0 ? "+" : ""}${team.gd}</td>
                <td>${team.points}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;
  }).join("");
}









function renderBracket(){
  const box = document.getElementById("bracketBox");

function intFmt(v){ return Number.isFinite(v) ? String(Math.round(v)) : "-"; }
function numFmt(v,d=1){ return Number.isFinite(v) ? Number(v).toFixed(d).replace(/\.0$/,"") : "-"; }
function pctFmt(v){ return Number.isFinite(v) ? `${Number(v).toFixed(1)}%` : "-"; }
function signedFmt(v,d=2){
  if(!Number.isFinite(v)) return "-";
  const n = Number(v);
  return `${n > 0 ? "+" : ""}${n.toFixed(d)}`;
}
function rateWithGames(rate,games,wins){
  if(!games) return "-";
  return `${wins}승/${games}전 · ${pctFmt(rate)}`;
}
function valueClass(key,value){
  if(!Number.isFinite(value)) return "";
  if(["WAE","WPA"].includes(key)) return value > 0 ? "sab-positive" : value < 0 ? "sab-negative" : "";
  if(["PI","VPI","WR","CPI"].includes(key)) return "sab-primary";
  return "";
}

function getPlayerMasterMap(){
  const map = new Map();
  TOURNAMENT_ROWS.forEach(row => {
    const name = String(row["이름"] || "").trim();
    if(!name) return;
    const current = map.get(name) || {name,team:"",tier:"",race:"",value:null};
    current.team = current.team || String(row["소속"] || "").trim();
    current.tier = current.tier || String(row["티어"] || "").trim();
    current.race = current.race || String(row["종족"] || "").trim();
    const value = numOrBlank(row["몸값"]);
    if(value !== null) current.value = value;
    map.set(name,current);
  });
  return map;
}

function expectedWinProbability(ownValue,oppValue){
  if(!(ownValue > 0) || !(oppValue > 0)) return null;
  return ownValue / (ownValue + oppValue);
}

function matchWinProbability(a,b,target,memo=new Map()){
  if(a >= target) return 1;
  if(b >= target) return 0;
  const key = `${a}|${b}|${target}`;
  if(memo.has(key)) return memo.get(key);
  const result = 0.5 * matchWinProbability(a+1,b,target,memo) + 0.5 * matchWinProbability(a,b+1,target,memo);
  memo.set(key,result);
  return result;
}

function getPowerRankingTierNumber(tier){
  const match = String(tier || "").trim().match(/\d+/);
  if(!match) return null;

  const tierNumber = Number(match[0]);
  return Number.isFinite(tierNumber) ? tierNumber : null;
}

function isPowerRankingTier(tier){
  const tierNumber = getPowerRankingTierNumber(tier);
  return tierNumber !== null && tierNumber >= 2 && tierNumber <= 8;
}

function buildSabermetrics(){
  const masters = getPlayerMasterMap();
  const players = new Map();

  function init(name,team){
    name = String(name || "").trim();
    if(!name || name === "미정") return null;
    if(!players.has(name)){
      const m = masters.get(name) || {};
      players.set(name,{
        name, team:m.team || team || "", tier:m.tier || "", race:m.race || "", value:m.value ?? null,
        matchIds:new Set(), SET:0,W:0,L:0, CL:0,MP:0,EQ:0,ES:0,ACE:0,
        valueGames:0,oppValueSum:0,winOppValueSum:0,winValueGames:0,lossOppValueSum:0,lossValueGames:0,
        xW:0,underdogG:0,underdogW:0,favoriteG:0,favoriteW:0,
        clutchOpp:0,clutchEarned:0,WPA:0
      });
    }
    const p = players.get(name);
    if(!p.team && team) p.team = team;
    return p;
  }

  MATCHES.forEach(match => {
    const finalA = Number(match.점수A || 0);
    const finalB = Number(match.점수B || 0);
    const derivedMax = match.sets.reduce((mx,s)=>Math.max(mx,Number(s.팀A점수전 || 0)+1,Number(s.팀B점수전 || 0)+1),0);
    const target = Math.max(finalA,finalB,derivedMax);
    if(target <= 0) return;

    let streakTeam = "";
    let streakCount = 0;

    match.sets.forEach(set => {
      const aName = set.세트A, bName = set.세트B, winner = set.세트승자;
      if(!aName || !bName || !winner || winner === "미정") return;
      const a = init(aName,match.팀A), b = init(bName,match.팀B);
      if(!a || !b) return;

      const aWin = winner === aName || set.세트승리팀 === "팀A";
      const bWin = winner === bName || set.세트승리팀 === "팀B";
      if(!aWin && !bWin) return;

      const preA = Number.isFinite(set.팀A점수전) ? set.팀A점수전 : 0;
      const preB = Number.isFinite(set.팀B점수전) ? set.팀B점수전 : 0;
      const postA = preA + (aWin ? 1 : 0);
      const postB = preB + (bWin ? 1 : 0);
      const winningSide = aWin ? "팀A" : "팀B";

      [a,b].forEach(p => { p.SET++; p.matchIds.add(match.key); });
      if(aWin){ a.W++; b.L++; } else { b.W++; a.L++; }

      const aExp = expectedWinProbability(a.value,b.value);
      const bExp = aExp === null ? null : 1-aExp;
      [[a,b.value,aExp,aWin],[b,a.value,bExp,bWin]].forEach(([p,oppValue,exp,won]) => {
        if(exp === null || !(oppValue > 0)) return;
        p.valueGames++;
        p.oppValueSum += oppValue;
        p.xW += exp;
        if(won){ p.winOppValueSum += oppValue; p.winValueGames++; }
        else { p.lossOppValueSum += oppValue; p.lossValueGames++; }
        if(p.value < oppValue){ p.underdogG++; if(won) p.underdogW++; }
        else if(p.value > oppValue){ p.favoriteG++; if(won) p.favoriteW++; }
      });

      const beforePA = matchWinProbability(preA,preB,target);
      const afterPA = matchWinProbability(postA,postB,target);
      const deltaA = afterPA-beforePA;
      a.WPA += deltaA;
      b.WPA -= deltaA;

      const oppWasStreakingAgainstA = streakTeam === "팀B" && streakCount >= 2;
      const oppWasStreakingAgainstB = streakTeam === "팀A" && streakCount >= 2;

      function situationFor(p,won,ownPre,oppPre,ownPost,isEsOpp){
        const clOpp = ownPre === target-1;
        const mpOpp = oppPre === target-1;
        const eqOpp = ownPre < oppPre && ownPost === oppPre;
        const aceOpp = set.에이스전;
        const weights = {cl:1.5,mp:1.5,eq:1,es:1,ace:1.5};
        p.clutchOpp += (clOpp?weights.cl:0)+(mpOpp?weights.mp:0)+(eqOpp?weights.eq:0)+(isEsOpp?weights.es:0)+(aceOpp?weights.ace:0);
        if(!won) return;
        if(clOpp){ p.CL++; p.clutchEarned += weights.cl; }
        if(mpOpp){ p.MP++; p.clutchEarned += weights.mp; }
        if(eqOpp){ p.EQ++; p.clutchEarned += weights.eq; }
        if(isEsOpp){ p.ES++; p.clutchEarned += weights.es; }
        if(aceOpp){ p.ACE++; p.clutchEarned += weights.ace; }
      }
      situationFor(a,aWin,preA,preB,postA,oppWasStreakingAgainstA);
      situationFor(b,bWin,preB,preA,postB,oppWasStreakingAgainstB);

      if(streakTeam === winningSide) streakCount++;
      else { streakTeam = winningSide; streakCount = 1; }
    });
  });

  return [...players.values()].map(p => {
    p.GP = p.matchIds.size;
    p.WR = p.SET ? p.W/p.SET*100 : null;
    p.SOS = p.valueGames ? p.oppValueSum/p.valueGames : null;
    p.SOSW = p.winValueGames ? p.winOppValueSum/p.winValueGames : null;
    p.SOSL = p.lossValueGames ? p.lossOppValueSum/p.lossValueGames : null;
    p.EXP = p.valueGames ? p.xW/p.valueGames*100 : null;
    p.WAE = p.valueGames ? p.W-p.xW : null;
    p.UPR = p.underdogG ? p.underdogW/p.underdogG*100 : null;
    p.FAV = p.favoriteG ? p.favoriteW/p.favoriteG*100 : null;
    p.CPI = p.clutchOpp ? p.clutchEarned/p.clutchOpp*100 : null;
    p.situationScore = p.CL*1.5+p.MP*1.5+p.EQ+p.ES+p.ACE*1.5;
    p.VPI = p.valueGames ? 100+(p.WAE/p.valueGames*100) : null;
    const waePart = Number.isFinite(p.WAE) ? p.WAE*3 : 0;
    p.PI = p.W*3-p.L+p.situationScore+waePart+p.WPA*5;
    return p;
  }).filter(p =>
    p.SET > 0 &&
    isPowerRankingTier(p.tier)
  );
}

      <div id="sabLegend" class="sab-legend">${renderMetricLegend()}</div>
      <div id="sabTableArea"></div>
      <div class="sab-footnote">※ EXP·xW·WAE·SOS·UPR·FAV·VPI는 양 선수의 종합 점수가 모두 등록된 세트만 계산합니다. VPI는 100이 기대 수준입니다. PI와 CPI는 본 사이트의 자체 지표입니다.</div>
    </div>`;

  document.querySelectorAll("[data-sab-tab]").forEach(btn=>btn.onclick=()=>{
    currentPowerTab=btn.dataset.sabTab;
    powerSort={key:POWER_TAB_CONFIG[currentPowerTab].defaultSort,dir:"desc"};
    renderPowerRanking();
  });
  document.getElementById("sabHelpBtn").onclick=()=>document.getElementById("sabLegend").classList.toggle("open");
  bindPowerFilter("sabTeam","team"); bindPowerFilter("sabTier","tier"); bindPowerFilter("sabRace","race");
  document.getElementById("sabMinSet").onchange=e=>{powerFilters.minSet=Number(e.target.value||0);renderPowerTable();};
  const sabSearchInput = document.getElementById("sabSearch");
  const sabSearchBtn = document.getElementById("sabSearchBtn");
  const sabResetBtn = document.getElementById("sabResetBtn");

  const submitPowerSearch = () => {
    powerFilters.search = sabSearchInput.value.trim();
    renderPowerTable();
  };

  // 입력만 할 때는 조회하지 않음
  // Enter 또는 검색 버튼을 눌렀을 때만 적용
  sabSearchBtn.onclick = submitPowerSearch;

  sabSearchInput.onkeydown = e => {
    if(e.key === "Enter"){
      e.preventDefault();
      submitPowerSearch();
    }
  };

  // 초기화: 팀 / 티어 / 종족 / 최소 출전 / 선수 검색을 모두 기본값으로 복원
  sabResetBtn.onclick = () => {
    powerFilters = {
      team: "전체",
      tier: "전체",
      race: "전체",
      minSet: 0,
      search: ""
    };

    document.getElementById("sabTeam").value = "전체";
    document.getElementById("sabTier").value = "전체";
    document.getElementById("sabRace").value = "전체";
    document.getElementById("sabMinSet").value = "0";
    sabSearchInput.value = "";

    renderPowerTable();
  };

  renderPowerTable();
}

function filterSelect(label,id,options,current,labeler=v=>v){
  return `<div class="sab-field"><label for="${id}">${label}</label><select id="${id}">${options.map(v=>`<option value="${esc(v)}" ${String(v)===String(current)?"selected":""}>${esc(labeler(v))}</option>`).join("")}</select></div>`;
}
function bindPowerFilter(id,key){ document.getElementById(id).onchange=e=>{powerFilters[key]=e.target.value;renderPowerTable();}; }

function renderMetricLegend(){
  const keys=["GP","SET","W","L","WR","CL","MP","EQ","ES","ACE","SOS","SOSW","SOSL","EXP","xW","WAE","UPR","FAV","CPI","WPA","VPI","PI"];
  return `<div class="sab-legend-grid">${keys.map(k=>`<div class="sab-legend-item"><b>${POWER_COLUMNS[k].label} · ${k}</b><br>${POWER_COLUMNS[k].tip||""}</div>`).join("")}</div>`;
}

function renderPowerTable(){
  const area=document.getElementById("sabTableArea");
  if(!area) return;
  const cfg=POWER_TAB_CONFIG[currentPowerTab];
  let list=buildSabermetrics().filter(p=>{
    if(powerFilters.team!=="전체"&&p.team!==powerFilters.team)return false;
    if(powerFilters.tier!=="전체"&&p.tier!==powerFilters.tier)return false;
    if(powerFilters.race!=="전체"&&p.race!==powerFilters.race)return false;
    if(p.SET<powerFilters.minSet)return false;
    if(powerFilters.search&&!p.name.toLowerCase().includes(powerFilters.search.trim().toLowerCase()))return false;
    return true;
  });
  list.sort((a,b)=>compareMetric(a,b,powerSort.key,powerSort.dir));
  if(!list.length){area.innerHTML='<div class="sab-empty">조건에 맞는 선수 기록이 없습니다.</div>';return;}

  area.innerHTML=`<div class="sab-table-wrap"><table class="sab-table"><thead><tr>${cfg.columns.map(k=>renderPowerHeader(k)).join("")}</tr></thead><tbody>${list.map((p,i)=>`<tr>${cfg.columns.map(k=>renderPowerCell(k,p,i)).join("")}</tr>`).join("")}</tbody></table></div>`;
  area.querySelectorAll("th[data-sort]").forEach(th=>th.onclick=()=>{
    const key=th.dataset.sort;
    powerSort=powerSort.key===key?{key,dir:powerSort.dir==="desc"?"asc":"desc"}:{key,dir:"desc"};
    renderPowerTable();
  });
}

function compareMetric(a,b,key,dir){
  let av=a[key],bv=b[key];
  if(av===null||av===undefined||Number.isNaN(av)) av=dir==="desc"?-Infinity:Infinity;
  if(bv===null||bv===undefined||Number.isNaN(bv)) bv=dir==="desc"?-Infinity:Infinity;
  let result=0;
  if(typeof av==="string") result=av.localeCompare(bv,undefined,{numeric:true}); else result=av-bv;
  if(result!==0) return dir==="desc" ? -result : result;
  return (b.W-a.W) || ((b.WR ?? -Infinity)-(a.WR ?? -Infinity)) || a.name.localeCompare(b.name);
}

function renderPowerHeader(key){
  const c=POWER_COLUMNS[key]||{label:key,short:""};
  const sortable=c.sortable!==false&&!['rank','player','team','record'].includes(key);
  const arrow=powerSort.key===key?(powerSort.dir==="desc"?" ▼":" ▲"):"";
  return `<th ${sortable?`class="sortable" data-sort="${key}"`:""} title="${esc(c.tip||c.label)}"><span class="sab-th-main">${esc(c.label)}${arrow}</span>${c.short?`<span class="sab-th-sub">${esc(c.short)}</span>`:""}</th>`;
}

function renderPowerCell(key,p,index){
  if(key==="rank") return `<td class="sab-rank ${index<3?"top":""}">${index+1}</td>`;
  if(key==="player") return `<td class="sab-player"><strong>${esc(p.name)}</strong><span>${esc([p.tier,p.race].filter(Boolean).join(" · ")||"-")}</span></td>`;
  if(key==="team") return `<td class="sab-team">${esc(p.team||"-")}</td>`;
  const c=POWER_COLUMNS[key];
  const value=key==="record"?null:p[key];
  const display=c&&c.fmt?c.fmt(value,p):(value??"-");
  return `<td class="${valueClass(key,value)}">${esc(display)}</td>`;
}

function updateBreadcrumb(main, sub){

  const el =
    document.getElementById("tournamentBreadcrumb");

  let mainName = "";
  let subName = "";

  switch(main){

    case "match":
      mainName = "일정";

      subName =
        sub === "table"
          ? "테이블"
          : "캘린더";
      break;

    case "record":
      mainName = "조/대진표";

      subName =
        sub === "bracket"
          ? "토너먼트"
          : "조별예선";
      break;

    case "team":
      mainName = "팀/참가자";
      break;

    case "power":
      mainName = "파워랭킹";
      break;
  }

  let text =
    `🏆 대회 정보 > ${mainName}`;

  if(subName){
    text += ` > ${subName}`;
  }

  el.textContent = text;
}
