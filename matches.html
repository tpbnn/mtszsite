async function loadTierExcel(){
  if(!window.XLSX){
    console.error('XLSX 라이브러리가 로드되지 않았습니다.');

  }

const TIER_SHEET_URL = "https://docs.google.com/spreadsheets/d/1jjguKLQE4dI76DBIbEw4ppxG26Ld8Eq7_cvbqFYU7Yo/gviz/tq?tqx=out:csv&sheet=tier";

const res = await fetch(TIER_SHEET_URL);

if(!res.ok){
  console.error('구글 스프레드시트 tier 로딩 실패:', res.status, res.statusText);

  return;
}

const csvText = await res.text();
const workbook = XLSX.read(csvText, { type:'string' });
  const sheet = workbook.Sheets[workbook.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });

  console.log('tier.xlsx rows:', rows);
  console.log('tier.xlsx columns:', rows[0] ? Object.keys(rows[0]) : []);

const range = XLSX.utils.decode_range(sheet['!ref']);

UNIVERSITY_LIST = [];

for(let r = 1; r <= range.e.r; r++){
  const cell = sheet[XLSX.utils.encode_cell({ r, c: 14 })];
  // c:15 = P열

  const value = String(cell?.v || '').trim();

  if(value && !UNIVERSITY_LIST.includes(value)){
    UNIVERSITY_LIST.push(value);
  }
}

console.log('O/P열 기준 UNIVERSITY_LIST', UNIVERSITY_LIST);


  PLAYERS = rows.map((row, index) => {
    const name =
      row['이름'] ||
      row['선수명'] ||
      row['선수 이름'] ||
      row.name ||
      row.Name ||
      row.playerName ||
      '';

const university =
  row['소속'] ||
  row['대학'] ||
  row['팀'] ||
  '';

    const raceRaw =
      row['종족'] ||
      row.race ||
      row.Race ||
      '';

    const tierRaw =
      row['티어'] ||
      row.tier ||
      row.Tier ||

    const raceCode = normalizeRaceCode(raceRaw);
    const tier = normalizeTierNumber(tierRaw);

    return {
      id: safePlayerId(name, index),
      name: String(name).trim(),

      raceCode,
      tier,
      university: String(university).trim()
    };
  }).filter(p => p.name);

  console.log('PLAYERS 로딩 완료:', PLAYERS.length, PLAYERS);
}

function normalizeRaceCode(value){
  const v = String(value || '').trim().toLowerCase();

  if(v === 'p' || v === 'protoss' || v === '프로토스') return 'P';
  if(v === 'z' || v === 'zerg' || v === '저그') return 'Z';
  if(v === 't' || v === 'terran' || v === '테란') return 'T';

  return 'R';
}

function normalizeTierNumber(value){
  const raw = String(value || '').trim();
  const lower = raw.toLowerCase();

  const specialTiers = ['god', 'king', 'jack', 'joker', 'jocker', 'spade', 'baby'];

  if(specialTiers.includes(lower)){
    return raw;
  }

  const n = raw.replace(/[^0-9]/g, '');
  return n ? Number(n) : 0;
}

function safePlayerId(name, index){
  const base = String(name || `player-${index}`)
    .trim()
    .replace(/\s+/g, '_')
    .replace(/[^\w가-힣♡♥★☆_-]/g, '');

  return base || `player-${index}`;
}

function fillPlayerDatalists(){

    `).join('');
  });
}


let GAME_RESULTS = [];
const RECORD_CACHE = new Map();

async function fetchPlayerRecords(playerName){
  const key = String(playerName || '').trim();

  if(RECORD_CACHE.has(key)){
    return RECORD_CACHE.get(key);
  }

  const url =
    `https://mstz-elo-sync.hyungjoonjoo.workers.dev/proxy-records?name=${encodeURIComponent(key)}&secret=calm2026sync`;

  const res = await fetch(url);
  const data = await res.json();

  if(!data.ok){
    console.error('전적 조회 실패:', key, data);
    return [];
  }

  const matches = data.matches || [];
  RECORD_CACHE.set(key, matches);

  return matches;
}

async function getHeadToHeadMatchup(playerAId, playerBId){
  const a = player(playerAId);
  const b = player(playerBId);

  if(!a || !b) return null;

  const aRecords = await fetchPlayerRecords(a.name);
  const bRecords = await fetchPlayerRecords(b.name);

  const gamesFromA = aRecords
    .filter(m => sameName(getOpponentName(m), b.name))
    .map(m => normalizeRealGame(m, a, b, 'A'));

  const gamesFromB = bRecords
    .filter(m => sameName(getOpponentName(m), a.name))
    .map(m => normalizeRealGame(m, a, b, 'B'));

  const merged = dedupeGames([...gamesFromA, ...gamesFromB]);

  let aWin = 0;
  let bWin = 0;
  const maps = {};

  merged.forEach(g => {
    if(g.winner === a.id) aWin++;
    if(g.winner === b.id) bWin++;

    const mapName = g.map || '-';
    if(!maps[mapName]) maps[mapName] = [0, 0];

    if(g.winner === a.id) maps[mapName][0]++;
    if(g.winner === b.id) maps[mapName][1]++;
  });

  return {
    a: a.id,
    b: b.id,
    aWin,
    bWin,
    games: sortByDateDesc(merged),
    maps,
    race: {},
    recent: merged.slice(0, 10).map(g => g.winner === a.id ? '승' : '패')
  };
}


function getOpponentName(m){
  return (
    m.opponent ||
    m.opponentName ||
    m.enemy ||
    m.enemyName ||
    m.target ||
    m.rival ||
    ''
  );
}

function cleanName(name){
  return String(name || '')
    .trim()
    .replaceAll('_', '')
    .replace(/\s+/g, '')
    .toLowerCase();
}

function sameName(a, b){
  const ca = cleanName(a);
  const cb = cleanName(b);

  return ca === cb || ca.includes(cb) || cb.includes(ca);
}

function normalizeRealGame(m, a, b, source){
  const result = m.result || m.winLose || m.status || '';
  const sourceWin = isWinResult(result);

  let winner;

  if(source === 'A'){
    winner = sourceWin ? a.id : b.id;
  }else{
    winner = sourceWin ? b.id : a.id;
  }

  return {
    date: m.playedAt || m.date || m.createdAt || '',
    type: '실제전적',
    playerA: a.id,
    playerB: b.id,
    winner,
    map: m.map || m.mapName || '-',
    score: m.score || '',
    raw: m
  };
}

function dedupeGames(games){
  const seen = new Set();

  return games.filter(g => {
    const key = [
      g.date,
      g.playerA,
      g.playerB,
      g.winner,
      g.map
    ].join('|');

    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function isWinResult(result){
  const r = String(result || '').toUpperCase();
  return ['WIN', 'W', '승', 'TRUE', '1'].includes(r);
}




const $ = (id) => document.getElementById(id);
let selectedA = '';
let selectedB = '';
let activeKey = '';
let recordRange = '3m';
let UNIVERSITY_LIST = [];

function player(id){ return PLAYERS.find(p => p.id === id); }
function pairKey(a,b){ return [a,b].sort().join('-'); }
function percent(w,l){ const total = w + l; return total ? Math.round((w / total) * 1000) / 10 : 0; }
function raceClass(code){ return code === 'Z' ? 'race-Z' : code === 'T' ? 'race-T' : code === 'P' ? 'race-P' : 'race-R'; }
function esc(v){ return String(v ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }
function sortByDateDesc(list){ return [...list].sort((a,b)=> String(b.date).localeCompare(String(a.date))); }

function filterGamesByRange(games){
  if(recordRange === 'all') return games;

  if(recordRange === '2026'){
    return games.filter(g => String(g.date).startsWith('2026'));
  }

  return games.filter(g => g.type === '최근 3개월');
}

function buildMatchups(){
  const map = new Map();
  const allowedGames = filterGamesByRange(GAME_RESULTS).filter(g => {
    const pa = player(g.playerA);
    const pb = player(g.playerB);
    return pa && pb && pa.tier === pb.tier;
  });

  allowedGames.forEach(g => {
    const key = pairKey(g.playerA, g.playerB);
    const [a,b] = key.split('-');
    if(!map.has(key)){
      map.set(key, { a, b, aWin:0, bWin:0, recent:[], maps:{}, race:{}, games:[] });
    }
    const m = map.get(key);
    const winnerIsA = g.winner === m.a;
    if(winnerIsA) m.aWin += 1;
    else m.bWin += 1;

    if(!m.maps[g.map]) m.maps[g.map] = [0,0];
    if(winnerIsA) m.maps[g.map][0] += 1;
    else m.maps[g.map][1] += 1;

    const opponentRace = player(m.b)?.race || '상대';
    const raceLabel = `Vs ${opponentRace === 'Protoss' ? '프로토스' : opponentRace === 'Zerg' ? '저그' : opponentRace === 'Terran' ? '테란' : opponentRace}`;
    if(!m.race[raceLabel]) m.race[raceLabel] = [0,0];
    if(winnerIsA) m.race[raceLabel][0] += 1;
    else m.race[raceLabel][1] += 1;

    m.games.push(g);
  });

  return Array.from(map.values()).map(m => {
    m.games = sortByDateDesc(m.games);
    m.recent = m.games.slice(0,10).map(g => g.winner === m.a ? '승' : '패');
    return m;
  });
}

let MATCHUPS = buildMatchups();

function findMatchup(a,b){ return MATCHUPS.find(m => pairKey(m.a,m.b) === pairKey(a,b)); }

function fillUniversitySelects(){
  const univs = ['소속 선택', ...UNIVERSITY_LIST];

    const univOk = !u || u === '소속 선택' || u === '전체 대학' || p.university === u;
    return keywordOk && univOk;
  }).slice(0, 6);
}

  const p = player(playerId);
  if(!p) return;

  const exists = selectedPlayers[side].some(item => item.id === p.id);

  if(side === 'A') selectedA = selectedPlayers.A[0]?.id || p.id;
  if(side === 'B') selectedB = selectedPlayers.B[0]?.id || p.id;

  renderAll(true);
}

function setUniversityPlayers(side, university){
  if(!university || university === '소속 선택'){
    selectedPlayers[side] = [];
  }else{
    selectedPlayers[side] = PLAYERS.filter(p => {
      const tierNum = Number(p.tier);
      return p.university === university && tierNum >= 2 && tierNum <= 8;
    });
  }

  if(side === 'A') selectedA = selectedPlayers.A[0]?.id || '';
  if(side === 'B') selectedB = selectedPlayers.B[0]?.id || '';

  renderAll(true);
}

function renderPlayerPools(){

`).join('');


  };

  render('A');

  document.querySelectorAll('.matches-player-chip .chip-remove').forEach(btn => {

    e.stopPropagation();

    const playerId = chip.dataset.player;

    if(side === 'B' && selectedB === playerId) selectedB = selectedPlayers.B[0]?.id || '';

    if(side === 'A' && pickedA === playerId) pickedA = '';
    if(side === 'B' && pickedB === playerId) pickedB = '';

    renderPlayerPools();
    renderMatchesList();
    renderDetail();

});

  chip.addEventListener('click', () => {

    const side = chip.dataset.side;

}

async function renderPickedMatch(){
  if(!pickedA || !pickedB) return;


console.log('pickedA=', pickedA);
console.log('pickedB=', pickedB);
  
  const a = player(pickedA);
  const b = player(pickedB);

  if(!a || !b) return;

  const key = pairKey(a.id, b.id);

  LOADING_MATCH_KEYS.add(key);
  renderDisplayedMatches();

  const matchup = await getHeadToHeadMatchup(a.id, b.id);

LOADING_MATCH_KEYS.delete(key);

if(!matchup){
  renderDisplayedMatches();
  return;
}

addDisplayedMatch(matchup);
  activeKey = key;

  renderDisplayedMatches();
  renderRealDetail(matchup);

pickedA = '';
pickedB = '';


}







function addDisplayedMatch(match){
  const key = pairKey(match.a, match.b);

  DISPLAYED_MATCHES = DISPLAYED_MATCHES.filter(
    m => pairKey(m.a, m.b) !== key
  );

  DISPLAYED_MATCHES.push(match);

  activeKey = key;
  renderDisplayedMatches();
  renderRealDetail(match);
}

function renderDisplayedMatches(){
  const box = $('matchesList');

  const loadingRows = [...LOADING_MATCH_KEYS].map(key => {
    const [aId, bId] = key.split('-');
    const a = player(aId);
    const b = player(bId);

return `
  <article class="matches-row-card match-grid-row loading-row" data-key="${key}">
    <div class="matches-loading-inline">
      <span class="loading-spinner"></span>
      <span>로딩 중...</span>
    </div>
  </article>
`;
  }).join('');

  let prevLeftPlayerId = '';

const matchRows = DISPLAYED_MATCHES.map(m => {
  const currentLeftPlayerId = m.a;

  const groupStart =
    prevLeftPlayerId !== '' &&
    prevLeftPlayerId !== currentLeftPlayerId;

  prevLeftPlayerId = currentLeftPlayerId;

  return renderMatchRow(m, {
    active: pairKey(m.a, m.b) === activeKey,
    withDelete: true,
    groupStart
  });
}).join('');

  box.innerHTML = matchRows + loadingRows;

  document.querySelectorAll('.matches-row-card:not(.loading-row)').forEach(card => {
    card.addEventListener('click', () => {
      const key = card.dataset.key;
      const match = DISPLAYED_MATCHES.find(m => pairKey(m.a, m.b) === key);
      if(!match) return;

      activeKey = key;
      renderDisplayedMatches();
      renderRealDetail(match);
    });
  });

  
}

function getScoreFromGames(games, aId, bId){
  let aWin = 0;
  let bWin = 0;

  games.forEach(g => {
    if(g.winner === aId) aWin++;
    if(g.winner === bId) bWin++;
  });

  return { aWin, bWin };
}

function getGameDate(g){
  const d = String(g.date || '').slice(0, 10);
  return d;
}

function toDate(value){
  const d = new Date(String(value || '').slice(0, 10));
  return Number.isNaN(d.getTime()) ? null : d;
}

function filterLast30Days(games){
  const dates = games.map(g => toDate(g.date)).filter(Boolean);
  if(!dates.length) return [];

  const latest = new Date(Math.max(...dates.map(d => d.getTime())));
  const start = new Date(latest);
  start.setDate(start.getDate() - 30);

  return games.filter(g => {
    const d = toDate(g.date);
    return d && d >= start && d <= latest;
  });
}

function rawRaceStats(playerName){
  const records = RECORD_CACHE.get(String(playerName || '').trim()) || [];

  const stat = {
    total:{ win:0, lose:0 },
    P:{ win:0, lose:0 },
    Z:{ win:0, lose:0 },
    T:{ win:0, lose:0 }
  };

  records.forEach(r => {
    const race = normalizeRaceCode(r.opponentRace || r.race_vs || r.raceVs || '');
    const win = isWinResult(r.result || r.win_loss || r.winLose);

    if(win) stat.total.win++;
    else stat.total.lose++;

    if(stat[race]){
      if(win) stat[race].win++;
      else stat[race].lose++;
    }
  });

  return stat;
}

function statLine(label, s){
  const total = s.win + s.lose;

  return `

      <span>${label}</span>
      <strong>${s.win}승 ${s.lose}패 · ${rate}%</strong>

  `;
}

function getPlayerTotalStats(playerId){
  const stat = {
    total: { win:0, lose:0 },
    P: { win:0, lose:0 },
    Z: { win:0, lose:0 },
    T: { win:0, lose:0 }
  };

  filterGamesByRange(GAME_RESULTS).forEach(g => {
    if(g.playerA !== playerId && g.playerB !== playerId) return;

    const opponentId = g.playerA === playerId ? g.playerB : g.playerA;
    const opponent = player(opponentId);
    if(!opponent) return;

    const isWin = g.winner === playerId;
    const raceCode = opponent.raceCode;

    if(isWin){
      stat.total.win += 1;
      if(stat[raceCode]) stat[raceCode].win += 1;
    }else{
      stat.total.lose += 1;
      if(stat[raceCode]) stat[raceCode].lose += 1;
    }
  });

  return stat;
}

    { label:'vs Terran', code:'T', left:a.T, right:b.T }

function bindSearchInput(inputId, side){
  const input = $(inputId);
  const suggest = $(side === 'A' ? 'playerSuggestA' : 'playerSuggestB');

  function closeSuggest(){
    suggest.innerHTML = '';
    suggest.style.display = 'none';
  }

  function selectPlayer(playerId){
    addPlayerToSide(side, playerId);
    input.value = '';
    closeSuggest();
  }

  function renderSuggest(){
    const keyword = input.value.trim().toLowerCase();

    if(!keyword){
      closeSuggest();
      return;
    }

    const list = PLAYERS
      .filter(p => String(p.name || '').toLowerCase().includes(keyword))
      .slice(0, 8);

    if(!list.length){
      closeSuggest();
      return;
    }

    suggest.style.display = 'block';
    suggest.innerHTML = list.map(p => `
      <button type="button" class="matches-suggest-item" data-player="${esc(p.id)}">
        ${esc(p.name)}
      </button>
    `).join('');

    suggest.querySelectorAll('.matches-suggest-item').forEach(btn => {
      btn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        selectPlayer(btn.dataset.player);
      });
    });
  }

  input.addEventListener('input', renderSuggest);

  input.addEventListener('keydown', (e) => {
    if(e.key !== 'Enter') return;

    const first = suggest.querySelector('.matches-suggest-item');
    if(first){
      e.preventDefault();
      selectPlayer(first.dataset.player);
    }
  });

  input.addEventListener('blur', () => {
    setTimeout(closeSuggest, 150);
  });

  closeSuggest();
}

    선택한 티어 상대전적 불러오는 중...
  </div>
`;

$('matchDetail').innerHTML = `
  <div class="matches-empty matches-loading">
    상세 전적 불러오는 중...
  </div>
`;

  const pairTargets = [];

  selectedPlayers.A.forEach(a => {
    selectedPlayers.B.forEach(b => {
      if(String(a.tier) !== String(b.tier)) return;
      if(!selectedSet.has(String(a.tier))) return;

      pairTargets.push([a.id, b.id]);
    });
  });

  if(!pairTargets.length){
    box.innerHTML = '';
    $('matchDetail').innerHTML = '';
    activeKey = '';
    return;
  }

  const pairs = await Promise.all(
    pairTargets.map(([aId, bId]) => getHeadToHeadMatchup(aId, bId))
  );

const validPairs = pairs.filter(Boolean);

if(!validPairs.length){
  box.innerHTML = '';
  $('matchDetail').innerHTML = '';
  activeKey = '';
  return;
}

DISPLAYED_MATCHES = validPairs;
activeKey = pairKey(validPairs[0].a, validPairs[0].b);

renderDisplayedMatches();
renderRealDetail(validPairs[0]);

  activeKey = pairKey(validPairs[0].a, validPairs[0].b);
  renderRealDetail(validPairs[0]);

  document.querySelectorAll('.matches-row-card').forEach((card, index) => {
    card.addEventListener('click', () => {
      const match = validPairs[index];
      activeKey = pairKey(match.a, match.b);

      document.querySelectorAll('.matches-row-card')
        .forEach(el => el.classList.remove('active'));

      card.classList.add('active');

      renderRealDetail(match);
    });
  });
}


function renderMatchRow(m, options = {}){
  const a = player(m.a);
  const b = player(m.b);
  if(!a || !b) return '';

  const key = pairKey(m.a, m.b);
  const total = m.aWin + m.bWin;
  const aRate = total ? (m.aWin / total) * 100 : 0;
  const bRate = total ? (m.bWin / total) * 100 : 0;
  const diff = Math.abs(aRate - bRate);

const aAdv = diff >= 20 && aRate > bRate
  ? `<span class="matches-advantage left">우세</span>`
  : '';

const bAdv = diff >= 20 && bRate > aRate
  ? `<span class="matches-advantage right">우세</span>`
  : '';

 const deleteButton = options.withDelete
  ? `<button class="matches-delete-btn" type="button" data-delete-key="${key}">×</button>`
  : '';

  return `
<article
  class="matches-row-card match-grid-row
  ${options.active ? 'active' : ''}
  ${options.groupStart ? 'group-start' : ''}"
  data-key="${key}">

    <div class="match-player match-player-a">
      <strong class="match-name">${esc(a.name)}</strong>
      <span class="match-tier">${displayTier(a.tier)} ${raceShort(a.raceCode)}</span>
    </div>

    <div class="match-adv-cell match-adv-a">
      ${aAdv}
    </div>

    <div class="matches-score">
      <span class="blue">${m.aWin}</span>
      <span class="colon">:</span>
      <span class="red">${m.bWin}</span>
    </div>

    <div class="match-adv-cell match-adv-b">
      ${bAdv}
    </div>

    <div class="match-player match-player-b">
      <span class="match-tier">${displayTier(b.tier)} ${raceShort(b.raceCode)}</span>
      <strong class="match-name">${esc(b.name)}</strong>
    </div>

    <div class="match-delete-cell">
      ${deleteButton}
    </div>

  </article>
`;
}

async function initMatchesPage(){
  try{
    await loadTierExcel();
    fillUniversitySelects();
    bindEvents();
    renderPlayerPools();
    renderMatchesList();
    renderDetail();
  }catch(err){
    console.error('상대전적 페이지 초기화 실패:', err);
    const message = err && err.message ? err.message : String(err);
    const listBox = $('matchesList');
    const detailBox = $('matchDetail');

    if(listBox){
      listBox.innerHTML = `<div class="matches-empty">선수 목록을 불러오지 못했습니다.<br>${esc(message)}</div>`;
    }

    if(detailBox){
      detailBox.innerHTML = `<div class="matches-empty">상세 전적 데이터가 없습니다.</div>`;
    }
  }
}

window.addEventListener('DOMContentLoaded', initMatchesPage);


document.addEventListener('click', (e) => {
  const btn = e.target.closest('.matches-delete-btn');
  if(!btn) return;

  e.preventDefault();
  e.stopPropagation();

  const key = btn.dataset.deleteKey;
  if(!key) return;

  DISPLAYED_MATCHES = DISPLAYED_MATCHES.filter(m => pairKey(m.a, m.b) !== key);
  LOADING_MATCH_KEYS.delete(key);

  const row = btn.closest('.matches-row-card');
  if(row) row.remove();

  if(activeKey === key){
    activeKey = DISPLAYED_MATCHES[0]
      ? pairKey(DISPLAYED_MATCHES[0].a, DISPLAYED_MATCHES[0].b)
      : '';

    if(DISPLAYED_MATCHES[0]){
      renderRealDetail(DISPLAYED_MATCHES[0]);
    }else{
      $('matchDetail').innerHTML = `<div class="matches-empty">상대전적 데이터가 없습니다.</div>`;
    }
  }
});


</script>
