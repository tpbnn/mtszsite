  <style>
    .playlist-page-wrap{display:flex;flex-direction:column;gap:20px;}
    .playlist-tab-area{display:flex;gap:12px;flex-wrap:wrap;}
    .playlist-tab{width:auto;min-width:120px;height:58px;border:0;border-radius:18px;padding:0 20px;background:rgba(0,0,0,.5);color:#fff;font-size:14px;font-weight:1000;cursor:pointer;box-shadow:0 8px 18px rgba(15,23,42,.18);}
    .playlist-tab.active{background:linear-gradient(135deg,#1d4ed8,#7c3aed);}
    .youtube-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start;}
    .youtube-player-box{background:#000;border-radius:22px;overflow:hidden;aspect-ratio:16/9;margin-top:44px;}
    .youtube-player-box iframe{width:100%;height:100%;border:0;display:block;}
    .youtube-list-box{background:none;border-radius:22px;padding:4px;min-height:624px;}
    body.dark .youtube-list-box{background:#111827;}
    .youtube-list-title{margin:0 0 16px;font-size:16px;font-weight:1000;color:#fff;}
    body.dark .youtube-list-title{color:#fff;}
    .youtube-list{display:flex;flex-direction:column;gap:4px;max-height:620px;overflow-y:auto;padding-right:8px;scrollbar-width:thin;scrollbar-color:#fff transparent;}
    .youtube-list::-webkit-scrollbar{width:2px;}
    .youtube-list::-webkit-scrollbar-track{background:transparent;}
    .youtube-list::-webkit-scrollbar-thumb{background:#4f6fb8;border-radius:999px;}
    .youtube-list::-webkit-scrollbar-thumb:hover{background:#6f8fda;}
    .youtube-item{width:100%;display:grid;grid-template-columns:110px 1fr;gap:2px;align-items:center;border:1px solid #e2e8f0;border-radius:16px;padding:4px;background:#f8fafc;cursor:pointer;text-align:left;min-height:62px;}
    .youtube-item:hover{background:#eef2ff;}
    .youtube-item.active{border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.16);}
    .youtube-item img{width:100px;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:none;margin-left:0;}
    .youtube-item-title{font-size:12px;line-height:1.4;font-weight:700;color:#111827;}
    .empty-playlist{padding:80px 0;text-align:center;font-size:20px;font-weight:900;color:#64748b;}
    .vod-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:#000;color:#fff;text-align:center;padding:24px;}
    .vod-placeholder-title{font-size:22px;font-weight:1000;}
    .vod-open-button{border:0;border-radius:14px;padding:14px 22px;background:#2563eb;color:#fff;font-size:16px;font-weight:1000;cursor:pointer;}
    @media(max-width:900px){.youtube-layout{grid-template-columns:1fr;}.youtube-list-box{min-height:auto;}.youtube-list{max-height:none;}}
    .soop-thumb{width:100px !important;height:auto !important;object-fit:contain !important;background:transparent !important;margin:auto;}
  </style>
</head>
