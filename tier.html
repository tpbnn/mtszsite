<head>
  <meta charset="UTF-8" />

  <style>
    .record-wrap{
      display:flex;
      flex-direction:column;
      gap:24px;
    }

  .record-search{
  display:flex;
  gap:12px;
  width:100%;
}

.search-wrap{
  position:relative;
  flex:1;
}

.record-search input{
  width:100%;
  height:52px;
  border-radius:16px;
  border:none;
  padding:0 18px;
  background:#202848;
  color:white;
  font-size:16px;
  box-sizing:border-box;
}

    .record-search button{
      width:140px;
      border:none;
      border-radius:16px;
      background:#0d8bff;
      color:white;
      font-weight:700;
      cursor:pointer;
    }

    .player-card{
      display:flex;
      gap:24px;
      align-items:center;
      padding:24px;
      border-radius:24px;
      background:#1d2546;
    }

    .player-card img{
      width:120px;
      height:120px;
      border-radius:50%;
      object-fit:cover;
    }

    .player-name{
      font-size:32px;
      font-weight:800;
    }

    .player-meta{
      margin-top:8px;
      color:#9fb2ff;
      font-size:15px;
    }

    .stats-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:20px;
    }

    .stats-card{
      background:#1d2546;
      border-radius:24px;
      padding:24px;
    }

    .stats-title{
      font-size:22px;
      font-weight:800;
      margin-bottom:18px;
    }

    .stats-row{
      display:flex;
      justify-content:space-between;
      padding:8px 0;
      border-bottom:1px solid rgba(255,255,255,.06);
    }

    .match-list{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

  .match-item{
  display:grid;
  grid-template-columns:170px 110px 170px 1fr 180px;
  align-items:center;
  gap:12px;
  padding:8px 28px;
  border-radius:22px;
  background:#1d2546;
}

.match-date{
  font-size:18px;
  font-weight:800;
  color:#ffffff;
}

.match-result{
  font-size:28px;
  font-weight:900;
  text-align:left;
}

.match-name strong{
  font-size:22px;
  font-weight:900;
  color:#ffffff;
}

.match-badges{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.match-badges span{
  padding:6px 12px;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  color:#b9c6ff;
  font-size:15px;
  font-weight:800;
}

.match-map{
  text-align:right;
  font-size:16px;
  font-weight:800;
  color:#dfe7ff;
}

    .win{
      color:#3ecfff;
      font-weight:800;
    }

    .lose{
      color:#ff5b7c;
      font-weight:800;
    }

@media(max-width:900px){

  .stats-grid{
    grid-template-columns:1fr;
  }

  .match-item{
    grid-template-columns:120px 60px 1fr;
    gap:14px;
    padding:18px;
  }

  .match-map{
    grid-column:3;
    margin-top:6px;
    text-align:left;
    font-size:18px;
  }

  .match-date{
    font-size:18px;
  }

  .match-result{
    font-size:22px;
  }

  .match-player strong{
    font-size:22px;
  }

}

.search-wrap{
  position:relative;
  flex:1;
}

.search-suggestions{
  position:absolute;
  top:100%;
  left:0;
  width:100%;
  background:#182554;
  border-radius:14px;
  overflow:hidden;
  z-index:50;
  display:none;
  margin-top:8px;
}

.suggestion-item{
  padding:14px 18px;
  cursor:pointer;
  transition:0.15s;
}

.suggestion-item:hover{
  background:#2563eb;
}

.enhanced-player-card{
  align-items:center;
}

.player-avatar{
  width:120px;
  height:120px;
  border-radius:50%;
  background:linear-gradient(135deg,#0d8bff,#57e6ff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  font-weight:900;
  color:white;
  flex-shrink:0;
  overflow:hidden;
  padding:5px;
  box-sizing:border-box;
}

.player-avatar img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  display:block;
}

.player-info-main{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.player-badges{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.player-badges span{
  padding:6px 12px;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  color:#b9c6ff;
  font-size:14px;
  font-weight:800;
}

.race-badge{
  color:#5fffe0 !important;
}

.tier-badge{
  color:#ffd166 !important;
}

.player-summary{
  font-size:16px;
  font-weight:800;
  color:white;
}

.recent-form{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.recent-form span{
  width:32px;
  height:32px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:900;
}

.form-win{
  background:rgba(62,207,255,.18);
  color:#3ecfff;
}

.form-lose{
  background:rgba(255,91,124,.18);
  color:#ff5b7c;
}

.map-filter{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.map-filter button{
  padding:10px 16px;
  border:none;
  border-radius:999px;
  background:#202848;
  color:white;
  font-weight:800;
  cursor:pointer;
}

.map-filter button:hover{
  background:#0d8bff;
}

.map-toggle-button{
  grid-column:1 / -1;
  height:52px;
  border:none;
  border-radius:18px;
  background:#0d8bff;
  color:white;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
}

.record-title-row{
  display:flex;
  align-items:center;
  gap:18px;
}

.record-loading{
  display:none;
  align-items:center;
  gap:10px;
  color:#9fb2ff;
  font-size:15px;
  font-weight:800;
}

.record-loading.active{
  display:flex;
}

.loading-spinner{
  width:18px;
  height:18px;
  border:3px solid rgba(255,255,255,.18);
  border-top-color:#3ecfff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

#scrollTopBtn {
  position: fixed;
  bottom: 20px;
  left: 20px; /* 왼쪽 하단 */
  z-index: 1000;
  font-size: 24px;
  border: none;
  outline: none;
  background-color: #ff3b30; /* 버튼 색상 */
  color: white;
  cursor: pointer;
  padding: 12px;
  border-radius: 50%;
  box-shadow: 0 4px 8px rgba(0,0,0,0.3);
  transition: background-color 0.3s, transform 0.3s;
}

#scrollTopBtn:hover {
  background-color: #ff625a;
  transform: scale(1.1);
}



  </style>
</head>
