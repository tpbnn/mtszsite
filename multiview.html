  <style>
    .multiview-wrap {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 24px;
      margin-top: 20px;
    }

    .multiview-card {
      padding: 24px;
      border-radius: 22px;
      background: var(--card-bg, rgba(255,255,255,0.06));
      border: 1px solid var(--border-color, rgba(255,255,255,0.12));
    }

    .multiview-card h3 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .multiview-desc {
      margin: 0 0 18px;
      color: var(--muted, #9ca3af);
      font-size: 14px;
      line-height: 1.5;
    }

    .multi-input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .multi-input-row input,
    .search-input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(0,0,0,0.22);
      color: inherit;
      outline: none;
      font-size: 14px;
    }

    .multi-input-row input:focus,
    .search-input:focus {
      border-color: rgba(80,160,255,0.8);
      box-shadow: 0 0 0 3px rgba(80,160,255,0.18);
    }

    .multi-button {
      flex: 0 0 auto;
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      background: #2f7cff;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    .multi-button:hover {
      filter: brightness(1.08);
    }

    .open-multiview-button {
      width: 100%;
      margin-top: 18px;
      padding: 15px 18px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #2f7cff, #7c3aed);
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    .selected-list {
      display: grid;
      gap: 10px;
      min-height: 140px;
    }

    .selected-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 140px;
      border: 1px dashed rgba(255,255,255,0.18);
      border-radius: 16px;
      color: var(--muted, #9ca3af);
      font-size: 14px;
    }

    .selected-streamer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .selected-streamer strong {
      display: block;
      font-size: 15px;
    }

    .selected-streamer span {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      color: var(--muted, #9ca3af);
    }

    .remove-button {
      border: 0;
      border-radius: 10px;
      padding: 8px 10px;
      background: rgba(255,80,80,0.16);
      color: #ff8b8b;
      cursor: pointer;
      font-weight: 800;
    }

    .member-search-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 4px;
    }

.member-search-list::-webkit-scrollbar{
  width:6px;
}

.member-search-list::-webkit-scrollbar-track{
  background:rgba(255,255,255,.04);
  border-radius:999px;
}

.member-search-list::-webkit-scrollbar-thumb{
  background:linear-gradient(
    180deg,
    #4f8cff,
    #6d4cff
  );
  border-radius:999px;
}

.member-search-list::-webkit-scrollbar-thumb:hover{
  background:linear-gradient(
    180deg,
    #66a3ff,
    #845fff
  );
}

    .member-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
    }

    .member-item:hover {
      background: rgba(47,124,255,0.16);
      border-color: rgba(47,124,255,0.5);
    }

    .member-name {
      font-weight: 900;
      font-size: 15px;
    }

    .member-id {
      margin-top: 3px;
      font-size: 12px;
      color: var(--muted, #9ca3af);
    }

    .add-badge {
      flex: 0 0 auto;
      padding: 6px 9px;
      border-radius: 999px;
      background: rgba(47,124,255,0.18);
      color: #8ab7ff;
      font-size: 12px;
      font-weight: 900;
    }

    .count-chip {
      display: inline-flex;
      align-items: center;
      margin-left: 8px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(47,124,255,0.16);
      color: #8ab7ff;
      font-size: 12px;
      font-weight: 900;
    }

    @media (max-width: 900px) {
      .multiview-wrap {
        grid-template-columns: 1fr;
      }
    }

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    const selectedStreamers = [];
    let recommendedMembers = [];

    /*
      이름/소속 검색용 명단은 Google 스프레드시트의 tier 시트에서 직접 불러옵니다.
      name: 이름
      id: 방송국ID
      university: 소속
    */
    let memberList = [];

const TIER_CSV_URL =
  "https://docs.google.com/spreadsheets/d/1jjguKLQE4dI76DBIbEw4ppxG26Ld8Eq7_cvbqFYU7Yo/gviz/tq?tqx=out:csv&sheet=tier";

async function loadTierMembers() {
  try {
    const response = await fetch(TIER_CSV_URL, { cache: "no-store" });

    if (!response.ok) {
      throw new Error(`tier 시트 HTTP ${response.status}`);
    }

    const csvText = await response.text();

    const workbook = XLSX.read(csvText, { type: "string" });
    const firstSheetName = workbook.SheetNames[0];
    const sheet = workbook.Sheets[firstSheetName];

    // 객체 변환 대신 2차원 배열로 읽어
    // 선수별 실제 행 데이터인 '이름' / '방송국ID' / '소속' 열 위치를 직접 찾는다.
    const rows = XLSX.utils.sheet_to_json(sheet, {
      header: 1,
      defval: "",
      raw: false
    });

    if (!rows.length) {
      throw new Error("tier 시트에 데이터가 없습니다.");
    }

    const headers = rows[0].map(value => String(value || "").trim());

    const nameCol = headers.findIndex(header => header === "이름");
    const idCol = headers.findIndex(header => header === "방송국ID");
    const universityCol = headers.findIndex(header => header === "소속");

    if (nameCol < 0 || idCol < 0 || universityCol < 0) {
      console.error("tier 헤더:", headers);
      throw new Error(
        `필수 열을 찾지 못했습니다. 이름=${nameCol}, 방송국ID=${idCol}, 소속=${universityCol}`
      );
    }

    memberList = rows
      .slice(1)
      .map(row => ({
        name: String(row[nameCol] || "").trim(),
        id: String(row[idCol] || "").trim(),
        university: String(row[universityCol] || "").trim()
      }))
      .filter(member => member.name && member.id);

    console.log(
      `[멀티뷰] tier 로드 완료: ${memberList.length}명 / 소속 열=${universityCol + 1}`
    );

    renderMemberList();
    renderUniversityOptions();
    renderUniversityMembers();

  } catch (error) {
    console.error("Google tier 시트 불러오기 실패:", error);

    const memberBox = document.getElementById("memberSearchList");
    if (memberBox) {
      memberBox.innerHTML = `
        <div class="selected-empty">
          tier 시트 명단을 불러오지 못했습니다.
        </div>
      `;
    }

    const universityBox = document.getElementById("universityMemberList");
    if (universityBox) {
      universityBox.innerHTML = `
        <div class="selected-empty">
          소속 정보를 불러오지 못했습니다.
        </div>
      `;
    }
  }
}


async function loadRecommendedMembers() {
  try {
    const firebaseConfig = {
      apiKey: "AIzaSyCCpMgZ4DkpqfNvCisH-IJjlxP_r6S5LKU",
      authDomain: "fancalmmstz.firebaseapp.com",
      projectId: "fancalmmstz",
      storageBucket: "fancalmmstz.firebasestorage.app",
      messagingSenderId: "671096603122",
      appId: "1:671096603122:web:f1d7de0cda877d7330eb6b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const snapshot = await getDocs(collection(db, "members"));

    // 이 배열은 이제 "캄몬스타즈 멤버 전체" 용도로 사용
    recommendedMembers = [];

    snapshot.forEach(doc => {
      const data = doc.data();
      const name = String(data.name || "").trim();
      const id = String(data.soopId || "").trim();

      if (!name || !id) return;

      recommendedMembers.push({
        name,
        id,
        order: Number(data.order || 999),
        recommend: data.multiviewRecommend === true
      });
    });

    // 관리자 order 기준 정렬, 같은 order면 이름순
    recommendedMembers.sort((a, b) =>
      (a.order - b.order) || a.name.localeCompare(b.name, "ko")
    );

    renderMemberList();
  } catch(error) {
    console.error(error);
  }
}


    function normalizeText(text) {
      return String(text || "").toLowerCase().replace(/\s/g, "");
    }

    function findMemberByInput(value) {
      const raw = String(value || "").trim();
      const normalized = normalizeText(raw);

      const merged = [
        ...recommendedMembers,
        ...memberList
      ].filter((member, index, arr) =>
        member && member.id &&
        arr.findIndex(item => item.id === member.id) === index
      );

      const exact = merged.find(member =>
        normalizeText(member.id) === normalized ||
        normalizeText(member.name) === normalized
      );

      if (exact) return exact;

      const partial = merged.filter(member =>
        normalizeText(member.name).includes(normalized)
      );

      return partial.length === 1 ? partial[0] : null;
    }

    function addStreamer() {
      const input = document.getElementById("streamerInput");
      const value = input.value.trim();

      if (!value) {
        alert("이름 또는 SOOP 아이디를 입력해주세요.");
        return;
      }

      const values = value
        .split(",")
        .map(v => v.trim())
        .filter(Boolean);

      for (const valueItem of values) {
        const member = findMemberByInput(valueItem);

        if (member) {
          addStreamerById(member.id);
          continue;
        }

        // 한글 이름처럼 보이는데 명단에 없으면 잘못된 ID 추가를 막음
        if (/[가-힣]/.test(valueItem)) {
          alert(`"${valueItem}" 스트리머를 찾지 못했습니다. SOOP 아이디를 입력하세요.`);
          continue;
        }

        // 영문/숫자 입력은 SOOP ID 직접 입력으로 처리
        addStreamerById(valueItem);
      }

      input.value = "";
      renderSelectedList();
      renderMemberList();
      renderUniversityMembers();
    }

    function addStreamerById(id) {
      if (selectedStreamers.length >= 8) {
        alert("최대 8명까지만 선택할 수 있습니다.");
        return;
      }

      if (!selectedStreamers.includes(id)) {
        selectedStreamers.push(id);
      }
    }

    function resetStreamers() {
      if (selectedStreamers.length === 0) return;
      selectedStreamers.splice(0, selectedStreamers.length);
      renderSelectedList();
      renderMemberList();
      renderUniversityMembers();
      document.getElementById("streamerInput")?.focus();
    }

    function removeStreamer(index) {
      selectedStreamers.splice(index, 1);
      renderSelectedList();
      renderMemberList();
      renderUniversityMembers();
    }

    function renderSelectedList() {
      const list = document.getElementById("selectedList");
      const count = document.getElementById("selectedCount");

      count.textContent = `${selectedStreamers.length} / 8`;

      if (selectedStreamers.length === 0) {
        list.innerHTML = `
          <div class="selected-empty">
            선택된 방송이 없습니다.
          </div>
        `;
        return;
      }

      list.innerHTML = selectedStreamers.map((id, index) => {
        const member =
  memberList.find(m => m.id === id) ||
  recommendedMembers.find(m => m.id === id);

const name = member ? member.name : "직접 입력";

        return `
          <div class="selected-streamer">
            <div>
              <strong>${name}</strong>
              <span>${id}</span>
            </div>
            <button class="remove-button" onclick="removeStreamer(${index})">
              삭제
            </button>
          </div>
        `;
      }).join("");
    }

function renderMemberList() {
  const list = document.getElementById("memberSearchList");

  // 캄몬스타즈 멤버 영역에는 Firebase members 컬렉션만 표시
  const filtered = recommendedMembers.filter((member, index, arr) =>
    member &&
    member.id &&
    arr.findIndex(item => item.id === member.id) === index
  );

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="selected-empty">
        캄몬스타즈 멤버 정보를 불러오는 중입니다.
      </div>
    `;
    return;
  }

  list.innerHTML = filtered.map(member => {
    const alreadySelected = selectedStreamers.includes(member.id);

    return `
      <div
        class="member-item ${alreadySelected ? "is-selected" : ""}"
        onclick="addMemberFromList('${member.id}')"
      >
        <div>
          <div class="member-name">${member.name}</div>
          <div class="member-id">${member.id}</div>
        </div>
        <div class="add-badge">
          ${alreadySelected ? "선택됨" : "추가"}
        </div>
      </div>
    `;
  }).join("");
}


function renderUniversityOptions() {
  const menu = document.getElementById("universityDropdownMenu");
  const hidden = document.getElementById("universitySelect");
  const button = document.getElementById("universityDropdownButton");

  if (!menu || !hidden || !button) return;

  const currentValue = hidden.value;

  const EXCLUDED_AFFILIATIONS = new Set(["FA", "NONE"]);

  const universities = [...new Set(
    memberList
      .map(member => String(member.university || "").trim())
      .filter(university =>
        university &&
        !EXCLUDED_AFFILIATIONS.has(university.toUpperCase())
      )
  )].sort((a, b) => a.localeCompare(b, "ko"));

  menu.innerHTML = universities.map(university => `
    <button
      type="button"
      class="university-option ${currentValue === university ? "active" : ""}"
      data-university="${escapeUniversityHtml(university)}"
      onclick="selectUniversity('${escapeUniversityJs(university)}')"
    >
      ${escapeUniversityHtml(university)}
    </button>
  `).join("");

  if (currentValue && universities.includes(currentValue)) {
    button.textContent = currentValue;
  } else {
    hidden.value = "";
    button.textContent = "목록에서 대학을 선택하세요";
  }
}

function positionUniversityDropdownMenu() {
  const dropdown = document.getElementById("universityDropdown");
  const button = document.getElementById("universityDropdownButton");
  const menu = document.getElementById("universityDropdownMenu");

  if (!dropdown || !button || !menu) return;

  const rect = button.getBoundingClientRect();
  const gap = 6;

  menu.style.left = `${Math.round(rect.left)}px`;
  menu.style.top = `${Math.round(rect.bottom + gap)}px`;
  menu.style.width = `${Math.round(rect.width)}px`;

  // 화면 아래 남은 공간에 맞춰 메뉴 높이 제한
  const available = window.innerHeight - rect.bottom - gap - 12;
  menu.style.maxHeight = `${Math.max(140, Math.min(320, available))}px`;
}

function toggleUniversityDropdown() {
  const dropdown = document.getElementById("universityDropdown");
  if (!dropdown) return;

  const willOpen = !dropdown.classList.contains("open");
  dropdown.classList.toggle("open");

  if (willOpen) {
    positionUniversityDropdownMenu();
  }
}

function selectUniversity(university) {
  const dropdown = document.getElementById("universityDropdown");
  const hidden = document.getElementById("universitySelect");
  const button = document.getElementById("universityDropdownButton");

  if (!hidden || !button) return;

  hidden.value = university;
  button.textContent = university;

  if (dropdown) dropdown.classList.remove("open");

  renderUniversityOptions();
  renderUniversityMembers();
}

function resetUniversityFilter() {
  const dropdown = document.getElementById("universityDropdown");
  const hidden = document.getElementById("universitySelect");
  const button = document.getElementById("universityDropdownButton");

  if (hidden) hidden.value = "";
  if (button) button.textContent = "목록에서 대학을 선택하세요";
  if (dropdown) dropdown.classList.remove("open");

  renderUniversityOptions();
  renderUniversityMembers();
}

function renderUniversityMembers() {
  const select = document.getElementById("universitySelect");
  const list = document.getElementById("universityMemberList");
  const count = document.getElementById("universityMemberCount");

  if (!select || !list || !count) return;

  const university = select.value;

  if (!university) {
    count.textContent = "0명";
    list.innerHTML = `
      <div class="selected-empty">
        소속을 선택해주세요.
      </div>
    `;
    return;
  }

  const EXCLUDED_AFFILIATIONS = new Set(["FA", "NONE"]);

  if (EXCLUDED_AFFILIATIONS.has(String(university || "").trim().toUpperCase())) {
    count.textContent = "0명";
    list.innerHTML = `
      <div class="selected-empty">
        표시하지 않는 소속입니다.
      </div>
    `;
    return;
  }

  const members = memberList.filter(member => {
    const affiliation = String(member.university || "").trim();
    return (
      affiliation === university &&
      !EXCLUDED_AFFILIATIONS.has(affiliation.toUpperCase())
    );
  });

  count.textContent = `${members.length}명`;

  if (members.length === 0) {
    list.innerHTML = `
      <div class="selected-empty">
        해당 소속의 멤버가 없습니다.
      </div>
    `;
    return;
  }

  list.innerHTML = members.map(member => {
    const alreadySelected = selectedStreamers.includes(member.id);

    return `
      <div
        class="member-item ${alreadySelected ? "is-selected" : ""}"
        onclick="addMemberFromList('${escapeUniversityJs(member.id)}')"
      >
        <div>
          <div class="member-name">${escapeUniversityHtml(member.name)}</div>
          <div class="member-id">${escapeUniversityHtml(member.id)}</div>
        </div>
        <div class="add-badge">
          ${alreadySelected ? "선택됨" : "추가"}
        </div>
      </div>
    `;
  }).join("");
}

function escapeUniversityHtml(value) {
  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeUniversityJs(value) {
  return String(value || "")
    .replaceAll("\\", "\\\\")
    .replaceAll("'", "\\'");
}

    function addMemberFromList(id) {
      if (selectedStreamers.includes(id)) {
        alert("이미 선택된 방송입니다.");
        return;
      }

      addStreamerById(id);
      renderSelectedList();
      renderMemberList();
      renderUniversityMembers();
    }

    function openMultiview() {
      if (selectedStreamers.length === 0) {
        alert("볼 사람을 1명 이상 추가해주세요.");
        return;
      }

      if (selectedStreamers.length > 8) {
        alert("최대 8명까지만 선택할 수 있습니다.");
        return;
      }

      const ids = selectedStreamers.join(",");

      const names = selectedStreamers.map(id => {
        const member =
          recommendedMembers.find(m => m.id === id) ||
          memberList.find(m => m.id === id);

        return member ? member.name : id;
      }).join(",");

      window.open(
        `multiview-player.html?ids=${encodeURIComponent(ids)}&names=${encodeURIComponent(names)}`,
        "_blank"
      );
    }

    document.getElementById("streamerInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        addStreamer();
      }
    });

    document.addEventListener("click", (e) => {
      const dropdown = document.getElementById("universityDropdown");
      if (!dropdown) return;

      if (!dropdown.contains(e.target)) {
        dropdown.classList.remove("open");
      }
    });

    window.addEventListener("resize", () => {
      const dropdown = document.getElementById("universityDropdown");
      if (dropdown?.classList.contains("open")) {
        positionUniversityDropdownMenu();
      }
    });

    window.addEventListener("scroll", () => {
      const dropdown = document.getElementById("universityDropdown");
      if (dropdown?.classList.contains("open")) {
        positionUniversityDropdownMenu();
      }
    }, true);

Object.assign(window, {
  addStreamer,
  resetStreamers,
  removeStreamer,
  renderMemberList,
  renderUniversityMembers,
  toggleUniversityDropdown,
  selectUniversity,
  resetUniversityFilter,
  addMemberFromList,
  openMultiview
});

    
async function initMultiviewPage() {
  renderSelectedList();
  await loadTierMembers();
  await loadRecommendedMembers();
  renderMemberList();
  renderUniversityOptions();
  renderUniversityMembers();
}

initMultiviewPage();
  </script>
