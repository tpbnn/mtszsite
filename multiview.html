  <style>
    .multiview-wrap {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 24px;
      margin-top: 20px;
    }

    .multiview-card {
      padding: 24px;
      border-radius: 22px;
      background: var(--card-bg, rgba(255,255,255,0.06));
      border: 1px solid var(--border-color, rgba(255,255,255,0.12));
    }

    .multiview-card h3 {

      font-size: 20px;
    }

    .multiview-desc {

      color: var(--muted, #9ca3af);
      font-size: 14px;
      line-height: 1.5;
    }

    .multi-input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .multi-input-row input,
    .search-input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(0,0,0,0.22);
      color: inherit;
      outline: none;
      font-size: 14px;
    }

    .multi-input-row input:focus,
    .search-input:focus {
      border-color: rgba(80,160,255,0.8);
      box-shadow: 0 0 0 3px rgba(80,160,255,0.18);
    }

    .multi-button {
      flex: 0 0 auto;
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      background: #2f7cff;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    .multi-button:hover {
      filter: brightness(1.08);
    }

    .open-multiview-button {
      width: 100%;
      margin-top: 18px;
      padding: 15px 18px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #2f7cff, #7c3aed);
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    .selected-list {
      display: grid;
      gap: 10px;

    }

    .selected-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 140px;
      border: 1px dashed rgba(255,255,255,0.18);
      border-radius: 16px;

    .selected-streamer {

      border-radius: 14px;
      background: rgba(255,255,255,0.07);

    .selected-streamer strong {

    }

    .selected-streamer span {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      color: var(--muted, #9ca3af);
    }

    .remove-button {
      border: 0;
      border-radius: 10px;
      padding: 8px 10px;
      background: rgba(255,80,80,0.16);
      color: #ff8b8b;
      cursor: pointer;
      font-weight: 800;
    }

    .member-search-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 4px;
    }

.member-search-list::-webkit-scrollbar{

}

.member-search-list::-webkit-scrollbar-track{

    .member-item {

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    const selectedStreamers = [];
    let recommendedMembers = [];

    /*
      여기 명단만 네 tier.xlsx 기준으로 채우면 됩니다.
      name: 화면에 보여줄 이름
      id: SOOP 방송국 아이디
    */
    let memberList = [];

async function loadTierMembers() {
  try {
    const response = await fetch("./tier.xlsx");
    const arrayBuffer = await response.arrayBuffer();

    const workbook = XLSX.read(arrayBuffer, { type: "array" });
    const firstSheetName = workbook.SheetNames[0];
    const sheet = workbook.Sheets[firstSheetName];

    const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });

    memberList = rows
      .map(row => ({
        name: String(row["이름"] || "").trim(),
        id: String(row["방송국ID"] || "").trim()
      }))
      .filter(member => member.name && member.id);

    renderMemberList();
  } catch (error) {
    console.error(error);
    document.getElementById("memberSearchList").innerHTML = `
      <div class="selected-empty">
        tier.xlsx 명단을 불러오지 못했습니다.
      </div>
    `;
  }
}


async function loadRecommendedMembers() {
  try {
    const firebaseConfig = {
      apiKey: "AIzaSyCCpMgZ4DkpqfNvCisH-IJjlxP_r6S5LKU",
      authDomain: "fancalmmstz.firebaseapp.com",
      projectId: "fancalmmstz",
      storageBucket: "fancalmmstz.firebasestorage.app",
      messagingSenderId: "671096603122",
      appId: "1:671096603122:web:f1d7de0cda877d7330eb6b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const snapshot = await getDocs(collection(db, "members"));

    // 이 배열은 이제 "캄몬스타즈 멤버 전체" 용도로 사용
    recommendedMembers = [];

    snapshot.forEach(doc => {
      const data = doc.data();
      const name = String(data.name || "").trim();
      const id = String(data.soopId || "").trim();

      if (!name || !id) return;

      recommendedMembers.push({
        name,
        id,
        order: Number(data.order || 999),
        recommend: data.multiviewRecommend === true
      });
    });

    // 관리자 order 기준 정렬, 같은 order면 이름순
    recommendedMembers.sort((a, b) =>
      (a.order - b.order) || a.name.localeCompare(b.name, "ko")
    );

    renderMemberList();
  } catch(error) {
    console.error(error);
  }
}


    function normalizeText(text) {
      return String(text || "").toLowerCase().replace(/\s/g, "");
    }

    function findMemberByInput(value) {
      const raw = String(value || "").trim();
      const normalized = normalizeText(raw);

      const merged = [
        ...recommendedMembers,
        ...memberList
      ].filter((member, index, arr) =>
        member && member.id &&
        arr.findIndex(item => item.id === member.id) === index
      );

      const exact = merged.find(member =>
        normalizeText(member.id) === normalized ||
        normalizeText(member.name) === normalized
      );

      if (exact) return exact;

      const partial = merged.filter(member =>
        normalizeText(member.name).includes(normalized)
      );

      return partial.length === 1 ? partial[0] : null;
    }

    function addStreamer() {
      const input = document.getElementById("streamerInput");
      const value = input.value.trim();

      if (!value) {
        alert("이름 또는 SOOP 아이디를 입력해주세요.");
        return;
      }

      const values = value
        .split(",")
        .map(v => v.trim())
        .filter(Boolean);

      for (const valueItem of values) {
        const member = findMemberByInput(valueItem);

        if (member) {
          addStreamerById(member.id);
          continue;
        }

        // 한글 이름처럼 보이는데 명단에 없으면 잘못된 ID 추가를 막음
        if (/[가-힣]/.test(valueItem)) {
          alert(`"${valueItem}" 멤버를 찾지 못했습니다.`);
          continue;
        }

        // 영문/숫자 입력은 SOOP ID 직접 입력으로 처리
        addStreamerById(valueItem);
      }

      input.value = "";
      renderSelectedList();
      renderMemberList();
    }

    function addStreamerById(id) {
      if (selectedStreamers.length >= 8) {
        alert("최대 8명까지만 선택할 수 있습니다.");
        return;
      }

      if (!selectedStreamers.includes(id)) {
        selectedStreamers.push(id);
      }
    }

    function resetStreamers() {
      if (selectedStreamers.length === 0) return;
      selectedStreamers.splice(0, selectedStreamers.length);
      renderSelectedList();
      renderMemberList();
      document.getElementById("streamerInput")?.focus();
    }

    function removeStreamer(index) {
      selectedStreamers.splice(index, 1);
      renderSelectedList();
      renderMemberList();
    }

    function renderSelectedList() {
      const list = document.getElementById("selectedList");
      const count = document.getElementById("selectedCount");

      count.textContent = `${selectedStreamers.length} / 8`;

      if (selectedStreamers.length === 0) {
        list.innerHTML = `
          <div class="selected-empty">
            선택된 방송이 없습니다.
          </div>
        `;
        return;
      }

      list.innerHTML = selectedStreamers.map((id, index) => {
        const member =
  memberList.find(m => m.id === id) ||
  recommendedMembers.find(m => m.id === id);

const name = member ? member.name : "직접 입력";

        return `
          <div class="selected-streamer">
            <div>
              <strong>${name}</strong>
              <span>${id}</span>
            </div>
            <button class="remove-button" onclick="removeStreamer(${index})">
              삭제
            </button>
          </div>
        `;
      }).join("");
    }

function renderMemberList() {
  const list = document.getElementById("memberSearchList");

  // 캄몬스타즈 멤버 영역에는 Firebase members 컬렉션만 표시
  const filtered = recommendedMembers.filter((member, index, arr) =>
    member &&
    member.id &&
    arr.findIndex(item => item.id === member.id) === index
  );

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="selected-empty">
        캄몬스타즈 멤버 정보를 불러오는 중입니다.
      </div>
    `;
    return;
  }

  list.innerHTML = filtered.map(member => {
    const alreadySelected = selectedStreamers.includes(member.id);

    return `
      <div
        class="member-item ${alreadySelected ? "is-selected" : ""}"
        onclick="addMemberFromList('${member.id}')"
      >
        <div>
          <div class="member-name">${member.name}</div>
          <div class="member-id">${member.id}</div>
        </div>
        <div class="add-badge">
          ${alreadySelected ? "선택됨" : "추가"}
        </div>
      </div>
    `;
  }).join("");
}

    function addMemberFromList(id) {
      if (selectedStreamers.includes(id)) {
        alert("이미 선택된 방송입니다.");
        return;
      }

      addStreamerById(id);
      renderSelectedList();
      renderMemberList();
    }

    function openMultiview() {
      if (selectedStreamers.length === 0) {
        alert("볼 사람을 1명 이상 추가해주세요.");
        return;
      }

      if (selectedStreamers.length > 8) {
        alert("최대 8명까지만 선택할 수 있습니다.");
        return;
      }

      const ids = selectedStreamers.join(",");

      const names = selectedStreamers.map(id => {
        const member =
          recommendedMembers.find(m => m.id === id) ||
          memberList.find(m => m.id === id);

        return member ? member.name : id;
      }).join(",");

      window.open(
        `multiview-player.html?ids=${encodeURIComponent(ids)}&names=${encodeURIComponent(names)}`,
        "_blank"
      );
    }

    document.getElementById("streamerInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        addStreamer();
      }
    });

Object.assign(window, {
  addStreamer,
  resetStreamers,
  removeStreamer,
  renderMemberList,
  addMemberFromList,
  openMultiview
});

    
async function initMultiviewPage() {
  renderSelectedList();
  await loadTierMembers();
  await loadRecommendedMembers();
  renderMemberList();
}

initMultiviewPage();
  </script>

</body>
</html>
