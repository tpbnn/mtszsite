<script>
const SHEET_ID = "1jjguKLQE4dI76DBIbEw4ppxG26Ld8Eq7_cvbqFYU7Yo";
const SHEET_NAME = "NCAUCTION";

let TOURNAMENT_ROWS = [];
let MATCHES = [];
let currentView = "table";
let currentTeam = "전체";
let calendarMonths = [];
let currentCalendarIndex = 0;

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, s => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[s]));
}

function sheetUrl(){
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
}

function normalizeDate(value){
  const raw = String(value || "").trim();
  if(!raw) return "";

  // 구글시트/엑셀 날짜 숫자 처리
  if(/^\d+(\.\d+)?$/.test(raw)){
    const serial = Number(raw);
    const utcDays = Math.floor(serial - 25569);
    const utcValue = utcDays * 86400 * 1000;
    const date = new Date(utcValue);

    const y = date.getUTCFullYear();
    const m = String(date.getUTCMonth() + 1).padStart(2, "0");
    const d = String(date.getUTCDate()).padStart(2, "0");

    return `${y}-${m}-${d}`;
  }

  const parts = raw.match(/\d+/g);
  if(!parts || parts.length < 3) return raw;

  const y = parts[0];
  const m = String(parts[1]).padStart(2, "0");
  const d = String(parts[2]).padStart(2, "0");

  return `${y}-${m}-${d}`;
}

async function loadTournamentSheet(){
  const res = await fetch(sheetUrl());

  if(!res.ok){
    throw new Error("시트를 불러오지 못했습니다.");
  }

  const csvText = await res.text();
  const workbook = XLSX.read(csvText, { type:"string" });
  const sheet = workbook.Sheets[workbook.SheetNames[0]];

  TOURNAMENT_ROWS = XLSX.utils.sheet_to_json(sheet, { defval:"" });

buildMatches();
buildCalendarMonths();
renderTeamFilter();
renderCalendar();
renderMatchList();
renderGroupStanding();
renderBracket();
renderTeamView();
renderPowerRanking();
}

function buildMatches(){
  const map = new Map();

  TOURNAMENT_ROWS.forEach(row => {
    if(!row["화면구분"] && !row["경기명"]) return;

    const matchKey = [
      row["화면구분"],
      row["경기구분"],
      row["조"],
      row["라운드"],
      row["경기명"],
      row["날짜"],
      row["시간"],
      row["팀A"],
      row["팀B"]
    ].join("|");

    if(!map.has(matchKey)){
      map.set(matchKey, {
        key: matchKey,
        화면구분: row["화면구분"],
        경기구분: row["경기구분"],
        조: row["조"],
        라운드: row["라운드"],
        경기명: row["경기명"],
        날짜: normalizeDate(row["날짜"]),
        원본날짜: row["날짜"],
        시간: row["시간"],
        상태: row["상태"],
        팀A: row["팀A"],
        점수A: row["점수A"],
        점수B: row["점수B"],
        팀B: row["팀B"],
        승리팀: row["승리팀"],
        sets: []
      });
    }

map.get(matchKey).sets.push({
  세트: row["세트"],
  세트A: row["세트A선수"],
  세트B: row["세트B선수"],
  세트승자: row["세트승자"],
  맵: row["맵"],

  세트A티어: row["선수A티어"] || "",
  세트A종족: row["선수A종족"] || "",
  세트B티어: row["선수B티어"] || "",
  세트B종족: row["선수B종족"] || "",

세트A비고: row["선수A비고"] || "",
세트B비고: row["선수B비고"] || "",

홈픽: row["선수A비고"] || "",
원정픽: row["선수B비고"] || ""
});
  });

  MATCHES = [...map.values()].sort((a, b) => {
  // 1순위: 날짜
  if(a.날짜 !== b.날짜){
    return a.날짜.localeCompare(b.날짜);
  }

  const timeA = String(a.시간 || "").trim();
  const timeB = String(b.시간 || "").trim();

  const isFixedA = /^\d{1,2}:\d{2}$/.test(timeA);
  const isFixedB = /^\d{1,2}:\d{2}$/.test(timeB);

  // 2순위: 시간이 있는 경기 먼저
  if(isFixedA && !isFixedB) return -1;
  if(!isFixedA && isFixedB) return 1;

  // 3순위: 시간이 둘 다 있으면 시간순
  if(isFixedA && isFixedB){
    return timeA.localeCompare(timeB);
  }

  // 4순위: 둘 다 시간이 없으면 입력 순서 유지
  return 0;
});
}

function buildCalendarMonths(){
  const validDates = MATCHES
    .map(m => m.날짜)
    .filter(Boolean)
    .sort();

  if(!validDates.length){
    calendarMonths = [];
    return;
  }

  const first = validDates[0].slice(0, 7);
  const last = validDates[validDates.length - 1].slice(0, 7);

  const [startY, startM] = first.split("-").map(Number);
  const [endY, endM] = last.split("-").map(Number);

  calendarMonths = [];

  let y = startY;
  let m = startM;

  while(y < endY || (y === endY && m <= endM)){
    calendarMonths.push({
      year: y,
      month: m
    });

    m++;

    if(m > 12){
      m = 1;
      y++;
    }
  }

  currentCalendarIndex = 0;
}

function renderCalendar(){
  const box = document.getElementById("calendarGrid");

  if(!MATCHES.length){
    box.innerHTML = `<div class="tournament-empty">등록된 일정이 없습니다.</div>`;
    return;
  }

  if(!calendarMonths.length){
    buildCalendarMonths();
  }

  const current = calendarMonths[currentCalendarIndex];

  if(!current){
    box.innerHTML = `<div class="tournament-empty">날짜 형식을 확인해주세요.</div>`;
    return;
  }

  const year = current.year;
  const month = current.month;

  const firstDay = new Date(year, month - 1, 1);
  const lastDate = new Date(year, month, 0).getDate();
  const startDay = firstDay.getDay();

  const monthTitle = `${year}.${String(month).padStart(2, "0")}`;

  let html = `
    <div class="jm-calendar">
<div class="jm-calendar-nav">
  <button id="calendarPrevBtn" ${currentCalendarIndex === 0 ? "disabled" : ""}>
  <span class="calendar-arrow">‹</span>
</button>
  <div class="jm-calendar-title">${monthTitle}</div>
  <button id="calendarNextBtn" ${currentCalendarIndex === calendarMonths.length - 1 ? "disabled" : ""}>
  <span class="calendar-arrow">›</span>
</button>
</div>

      <div class="jm-calendar-week">
        <div class="sun">일</div>
        <div>월</div>
        <div>화</div>
        <div>수</div>
        <div>목</div>
        <div>금</div>
        <div class="sat">토</div>
      </div>

      <div class="jm-calendar-days">
  `;

  for(let i = 0; i < startDay; i++){
    html += `<div class="jm-day empty"></div>`;
  }

  for(let day = 1; day <= lastDate; day++){
    const dateKey = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    const dayMatches = MATCHES.filter(m => m.날짜 === dateKey);

    html += `
      <div class="jm-day">
        <div class="jm-day-num">${day}</div>
        ${dayMatches.map(m => `
          <button class="jm-calendar-event" data-key="${esc(m.key)}">
            ${esc(m.시간 || "미정")} ${esc(m.경기명 || m.라운드)}<br>
${esc(m.팀A || "미정")} vs ${esc(m.팀B || "미정")}
          </button>
        `).join("")}
      </div>
    `;
  }

  html += `
      </div>
    </div>
  `;

  box.innerHTML = html;

  document.getElementById("calendarPrevBtn")?.addEventListener("click", () => {
    if(currentCalendarIndex <= 0) return;
    currentCalendarIndex--;
    renderCalendar();
  });

  document.getElementById("calendarNextBtn")?.addEventListener("click", () => {
    if(currentCalendarIndex >= calendarMonths.length - 1) return;
    currentCalendarIndex++;
    renderCalendar();
  });

  document.querySelectorAll(".jm-calendar-event").forEach(btn => {
    btn.addEventListener("click", () => {
      switchView("table");

      const target = MATCHES.find(m => m.key === btn.dataset.key);
      if(!target) return;

      currentTeam = "전체";
      renderMatchList(target.key);
    });
  });
}

function renderGroupStanding(){

  const box = document.getElementById("groupStandingBox");
  if(!box) return;

  const groups = {};

  const realTeams = new Set(
    getTeamList().map(team => team.name)
  );

  MATCHES.forEach(match => {
    if(match.화면구분 !== "조별예선") return;

    const group = String(match.조 || "기타").trim();
    if(!groups[group]) groups[group] = {};

    const teamA = String(match.팀A || "").trim();
    const teamB = String(match.팀B || "").trim();

    const hasTeamA = realTeams.has(teamA);
    const hasTeamB = realTeams.has(teamB);

    if(!hasTeamA && !hasTeamB) return;

    if(hasTeamA && !groups[group][teamA]){
      groups[group][teamA] = {
        team: teamA,
        games:0,
        win:0,
        lose:0,
        gf:0,
        ga:0,
        gd:0,
        points:0
      };
    }

    if(hasTeamB && !groups[group][teamB]){
      groups[group][teamB] = {
        team: teamB,
        games:0,
        win:0,
        lose:0,
        gf:0,
        ga:0,
        gd:0,
        points:0
      };
    }

    const aScore = Number(match.점수A || 0);
    const bScore = Number(match.점수B || 0);
    const winTeam = String(match.승리팀 || "").trim();
    const hasResult = winTeam && winTeam !== "미정";

if(hasResult){

  if(hasTeamA){
    groups[group][teamA].games++;
    groups[group][teamA].gf += aScore;
    groups[group][teamA].ga += bScore;
    groups[group][teamA].gd =
      groups[group][teamA].gf - groups[group][teamA].ga;
  }

  if(hasTeamB){
    groups[group][teamB].games++;
    groups[group][teamB].gf += bScore;
    groups[group][teamB].ga += aScore;
    groups[group][teamB].gd =
      groups[group][teamB].gf - groups[group][teamB].ga;
  }

}

    if(hasResult && hasTeamA && winTeam === teamA){
      groups[group][teamA].win++;
      groups[group][teamA].points += 5;

      if(hasTeamB){
        groups[group][teamB].lose++;
      }
    }

    if(hasResult && hasTeamB && winTeam === teamB){
      groups[group][teamB].win++;
      groups[group][teamB].points += 5;

      if(hasTeamA){
        groups[group][teamA].lose++;
      }
    }
  });

  const groupOrder = ["A조", "B조", "C조", "D조"];

  const visibleGroups = groupOrder.filter(group => {
    const teams = groups[group] || {};
    return Object.keys(teams).length > 0;
  });

  if(visibleGroups.length === 0){
    box.innerHTML = `
      <div class="tournament-empty">
        <center><h3>조 추첨이 이루어지지 않았습니다.</h3></center>
      </div>
    `;
    return;
  }

  box.innerHTML = visibleGroups.map(group => {

    const teams = groups[group] || {};

    const ranking = Object.values(teams).sort((a,b) => {
      if(b.points !== a.points) return b.points - a.points;
      if(b.win !== a.win) return b.win - a.win;
      if(b.gd !== a.gd) return b.gd - a.gd;
      if(b.gf !== a.gf) return b.gf - a.gf;
      return a.team.localeCompare(b.team);
    });

    return `
      <div class="group-standing-card">
        <table class="group-standing-table">
          <thead>
            <tr>
              <th>${esc(group)}</th>
              <th>경기</th>
              <th>W</th>
              <th>L</th>
              <th>득점</th>
              <th>실점</th>
              <th>득실</th>
              <th>승점</th>
            </tr>
          </thead>

          <tbody>
            ${ranking.map((team, idx) => `
              <tr>
                <td class="standing-team-cell">
                  <div class="standing-team-inner">
                    <span class="standing-rank">${idx + 1}위</span>

                    ${
                      getTeamLogo(team.team)
                        ? `<img class="standing-team-logo" src="${getTeamLogo(team.team)}" alt="${esc(team.team)}">`
                        : `<span class="standing-team-logo empty"></span>`
                    }

                    <span class="standing-team-name">${esc(team.team)}</span>
                  </div>
                </td>

                <td>${team.games}</td>
                <td>${team.win}</td>
                <td>${team.lose}</td>
                <td>${team.gf}</td>
                <td>${team.ga}</td>
                <td>${team.gd > 0 ? "+" : ""}${team.gd}</td>
                <td>${team.points}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;
  }).join("");
}

  const VALUE_BONUS = {

function toNumber(value){
  const cleaned = String(value ?? "")
    .replace(/,/g, "")
    .replace(/[^0-9.-]/g, "")
    .trim();

  const num = Number(cleaned);
  return Number.isFinite(num) ? num : 0;
}

function getPlayerInfoMap(){
  const map = {};

  TOURNAMENT_ROWS.forEach(row => {
    const name = String(row["이름"] || "").trim();
    if(!name) return;

    map[name] = {
      name,
      team: String(row["소속"] || "").trim(),
      race: String(row["종족"] || "").trim(),
      tier: String(row["티어"] || "").trim(),
      price: toNumber(row["선수 몸값"])
    };
  });

  return map;
}

// function makePowerRecord({ scope, playerA, playerB, winner, map, raceA, raceB }){
function makePowerRecord({
  scope,
  playerA,
  playerB,
  winner,
  map,
  raceA,
  raceB,
  weight
}){
  const a = String(playerA || "").trim();
  const b = String(playerB || "").trim();
  const w = String(winner || "").trim();

  if(!a || !b || !w || w === "미정") return null;
  if(w !== a && w !== b) return null;

return {
  scope,
  a,
  b,
  winner: w,
  loser: w === a ? b : a,
  map: String(map || "").trim(),
  aRace: String(raceA || "").trim(),
  bRace: String(raceB || "").trim(),
  weight: String(weight || "").trim()
};
}

function buildTournamentPowerRecords(){
  const infoMap = getPlayerInfoMap();
  const records = [];

  MATCHES.forEach(match => {
    match.sets.forEach(set => {
      const a = String(set.세트A || "").trim();
      const b = String(set.세트B || "").trim();

      const record = makePowerRecord({
        scope: "tournament",
        playerA: a,
        playerB: b,
        winner: set.세트승자,
        map: set.맵,
        raceA: set.세트A종족 || infoMap[a]?.race || "",
        raceB: set.세트B종족 || infoMap[b]?.race || ""
      });

      if(record) records.push(record);
    });
  });

  return records;
}

function buildScrimPowerRecords(){
  const infoMap = getPlayerInfoMap();
  const records = [];

  TOURNAMENT_ROWS.forEach(row => {
    const a = String(row["연습경기선수A"] || "").trim();
    const b = String(row["연습경기선수B"] || "").trim();

const record = makePowerRecord({
  scope: "scrim",
  playerA: a,
  playerB: b,
  winner: row["연습경기승리선수"],
  map: row["연습경기맵"],
  raceA: infoMap[a]?.race || "",
  raceB: infoMap[b]?.race || "",
  weight: row["연습가중치"] || ""
});

    if(record) records.push(record);
  });

  return records;
}

function buildAllPowerRecords(scope){
  return scope === "scrim"
    ? buildScrimPowerRecords()
    : buildTournamentPowerRecords();
}

function getPowerMaps(scope){
  const maps = buildAllPowerRecords(scope)
    .map(record => record.map)
    .filter(Boolean);

  return ["전체", ...Array.from(new Set(maps)).sort((a, b) => a.localeCompare(b))];
}

function getPowerRaces(){
  return ["전체", "P", "T", "Z"];
}

function getPowerRaceLabel(race){
  if(race === "전체") return "전체";
  if(["P", "T", "Z"].includes(race)) return `vs ${race}`;
  return race;
}

function getPowerTeams(){
  const infoMap = getPlayerInfoMap();
  const teams = Object.values(infoMap)
    .map(p => p.team)
    .filter(Boolean);

  return ["전체", ...Array.from(new Set(teams)).sort((a, b) => a.localeCompare(b))];
}

function getPowerTiers(){
  const infoMap = getPlayerInfoMap();
  const tierOrder = ["God", "King", "Jack", "Joker", "Spade", "0티어", "1티어", "2티어", "3티어", "4티어", "5티어", "6티어", "7티어", "Baby"];
  const tiers = Object.values(infoMap)
    .map(p => p.tier)
    .filter(Boolean);

  const unique = Array.from(new Set(tiers));
  unique.sort((a, b) => {
    const ai = tierOrder.indexOf(a);
    const bi = tierOrder.indexOf(b);
    if(ai !== -1 || bi !== -1){
      if(ai === -1) return 1;
      if(bi === -1) return -1;
      return ai - bi;
    }
    return a.localeCompare(b);
  });

  return ["전체", ...unique];
}

function getPowerPlayerRaces(){
  return ["전체", "P", "T", "Z"];
}

function getPowerFilteredRecords(){
  return buildAllPowerRecords(currentPowerScope);
}





function initPowerPlayer(players, name, infoMap){
  if(!name || name === "미정") return;

  if(!players[name]){
    const info = infoMap[name] || {};

    players[name] = {
      name,
      team: info.team || "",
      tier: info.tier || "-",
      race: info.race || "-",
      price: toNumber(info.price),

      games: 0,
      win: 0,
      lose: 0,

      // 몸값 대비 활약도는 100을 기준값으로 시작합니다.
      // 100 = 기대치 수준, 100 이상 = 몸값 이상 활약, 100 미만 = 기대 이하
      eloValue: 0,

      winRate: 0,
      activityScore: 0,
      valueScore: 0
    };
  }
}

function buildPlayerPowerRanking(){
  const infoMap = getPlayerInfoMap();
  const players = {};
  const records = getPowerFilteredRecords();

  const useBasicPlayerFilters =
    currentPowerMetric === "overall" ||
    currentPowerMetric === "value";

  const useTeamFilter =
    useBasicPlayerFilters &&
    currentPowerTeam !== "전체";

  const useTierFilter =
    useBasicPlayerFilters &&
    currentPowerTier !== "전체";

  const usePlayerRaceFilter =
    useBasicPlayerFilters &&
    currentPowerPlayerRace !== "전체";

  const useMapFilter =
    currentPowerMetric === "overall" &&
    currentPowerMap !== "전체";

  const useOpponentRaceFilter =
    currentPowerMetric === "overall" &&
    currentPowerRace !== "전체";

  const K = 32;

  const canApplyPlayer = (name, opponentRace) => {
    const info = infoMap[name] || {};

    if(useTeamFilter && info.team !== currentPowerTeam) return false;
    if(useTierFilter && info.tier !== currentPowerTier) return false;
    if(usePlayerRaceFilter && info.race !== currentPowerPlayerRace) return false;
    if(useOpponentRaceFilter && opponentRace !== currentPowerRace) return false;

    return true;
  };

  records.forEach(record => {
    if(useMapFilter && record.map !== currentPowerMap) return;

    initPowerPlayer(players, record.a, infoMap);
    initPowerPlayer(players, record.b, infoMap);

    const aOpponentRace = record.bRace || infoMap[record.b]?.race || "";
    const bOpponentRace = record.aRace || infoMap[record.a]?.race || "";

    const playerA = players[record.a];
    const playerB = players[record.b];

    const priceA = Math.max(1, toNumber(infoMap[record.a]?.price));
    const priceB = Math.max(1, toNumber(infoMap[record.b]?.price));

    const expectedA = priceA / (priceA + priceB);
    const expectedB = priceB / (priceA + priceB);
    const bonus = VALUE_BONUS[record.weight] || 0;

    if(playerA && canApplyPlayer(record.a, aOpponentRace)){
      const won = record.winner === record.a;

      playerA.games++;

if(won){
  playerA.win++;
  playerA.eloValue +=
    (K * (1 - expectedA)) + bonus;
} else {
  playerA.lose++;
  playerA.eloValue +=
    (K * (0 - expectedA)) - bonus;
}
    }

    if(playerB && canApplyPlayer(record.b, bOpponentRace)){
      const won = record.winner === record.b;

      playerB.games++;
if(won){
  playerB.win++;
  playerB.eloValue +=
    (K * (1 - expectedB)) + bonus;
} else {
  playerB.lose++;
  playerB.eloValue +=
    (K * (0 - expectedB)) - bonus;
}
    }
  });

  let list = Object.values(players).filter(p => p.games > 0);

  list.forEach(p => {
    p.winRate = p.games ? Math.round((p.win / p.games) * 100) : 0;
    p.activityScore = Math.round(p.eloValue);
    p.valueScore = Math.round(p.eloValue);
  });

  if(currentPowerMetric === "value"){
    list = list.filter(p => p.price > 0);

    return list.sort((a, b) => {
      if(b.valueScore !== a.valueScore) return b.valueScore - a.valueScore;
      if(b.winRate !== a.winRate) return b.winRate - a.winRate;
      if(b.win !== a.win) return b.win - a.win;
      if(a.lose !== b.lose) return a.lose - b.lose;
      if(b.games !== a.games) return b.games - a.games;
      return a.name.localeCompare(b.name);
    });
  }

  return list.sort((a, b) => {
    if(b.winRate !== a.winRate) return b.winRate - a.winRate;
    if(b.win !== a.win) return b.win - a.win;
    if(a.lose !== b.lose) return a.lose - b.lose;
    if(b.games !== a.games) return b.games - a.games;
    return a.name.localeCompare(b.name);
  });
}

    });

  });

});


/* 전적 드롭다운 */

document.querySelectorAll(".tournament-dropdown button[data-record]")
.forEach(btn => {

  btn.addEventListener("click", e => {

    e.stopPropagation();

    switchMainView("record");

    document.querySelectorAll(".tournament-menu-item").forEach(el => {
      el.classList.toggle(
        "active",
        el.dataset.main === "record"
      );
    });

    const record = btn.dataset.record;

    updateBreadcrumb("record", record);

    document
      .getElementById("groupStandingView")
      .classList.toggle("hidden", record !== "group");

    document
      .getElementById("bracketView")
      .classList.toggle("hidden", record !== "bracket");

  });

});


window.addEventListener("DOMContentLoaded", () => {
  loadTournamentSheet().catch(err => {
    console.error(err);
    document.getElementById("calendarGrid").innerHTML =
      `<div class="tournament-empty">대회 데이터를 불러오지 못했습니다.</div>`;
  });
});


function switchMainView(main){
  document.querySelectorAll(".main-tabs .tournament-tab").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.main === main);
  });

  document.getElementById("matchView").classList.toggle("hidden", main !== "match");
  document.getElementById("recordView").classList.toggle("hidden", main !== "record");
  document.getElementById("teamView").classList.toggle("hidden", main !== "team");
  document.getElementById("powerView").classList.toggle("hidden", main !== "power");
}

function updateBreadcrumb(main, sub){

  const el =
    document.getElementById("tournamentBreadcrumb");

  let mainName = "";
  let subName = "";

  switch(main){

    case "match":
      mainName = "일정";

      subName =
        sub === "table"
          ? "테이블"
          : "캘린더";
      break;

    case "record":
      mainName = "조/대진표";

      subName =
        sub === "bracket"
          ? "토너먼트"
          : "조별예선";
      break;

    case "team":
      mainName = "팀/참가자";
      break;

    case "power":
      mainName = "파워랭킹";
      break;
  }

  let text =
    `🏆 대회 정보 > ${mainName}`;

  if(subName){
    text += ` > ${subName}`;
  }

  el.textContent = text;
}
