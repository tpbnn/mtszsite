<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>플레이리스트 관리자 - 캄몬스타즈</title>

  <link rel="icon" href="./favicon.png" type="image/png" />
  <link rel="stylesheet" href="common.css" />

  <style>
    .manager-wrap{display:grid;grid-template-columns:360px 1fr;gap:24px;align-items:start;}
    .manager-card{background:#fff;border-radius:22px;padding:22px;}
    .manager-card h2{margin:0 0 16px;font-size:24px;color:#ff0000;}
    .form-row{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
    .form-row label{font-weight:900;}
    .form-row input,.form-row select{height:46px;border:1px solid #dbe3f0;border-radius:14px;padding:0 14px;font-size:15px;}
    .manager-btn{height:46px;border:0;border-radius:14px;font-weight:1000;cursor:pointer;background:#2563eb;color:white;}
    .manager-btn.danger{background:#dc2626;}
    .manager-btn.gray{background:#64748b;}
    .manager-btn.green{background:#16a34a;}
    .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .playlist-list,.video-list{display:flex;flex-direction:column;gap:10px;}
    .playlist-item,.video-item{border:1px solid #dbe3f0;border-radius:16px;padding:14px;background:#f8fafc;}
    .playlist-item{cursor:pointer;}
    .playlist-item.active{border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.14);}
    .playlist-name{font-size:17px;font-weight:1000;margin-bottom:8px;color:#16a34a;}
    .video-title{font-weight:1000;margin-bottom:6px;color:#16a34a;}
    .video-url{font-size:12px;color:#64748b;word-break:break-all;margin-bottom:8px;}
    .small-info{font-size:13px;color:#64748b;font-weight:800;margin-bottom:10px;}
    .item-actions{display:flex;gap:8px;}
    .item-actions button{flex:1;height:34px;border:0;border-radius:10px;font-weight:900;cursor:pointer;}
    .empty{padding:40px 0;text-align:center;color:#64748b;font-weight:900;}
    @media(max-width:900px){.manager-wrap{grid-template-columns:1fr;}}
  </style>
</head>

<body data-page="playlist-manager">

<div class="app">
  <header class="topbar">
    <a class="logo" href="index.html"><div>CALM MONSTARZ</div></a>
    <nav class="nav">
      <a data-page="home" href="index.html">홈</a>
      <a data-page="members" href="members.html">멤버 정보</a>
      <a data-page="matchresult" href="matchresult.html">경기 결과</a>
      <a data-page="tiers" href="tier.html">티어표</a>
      <a data-page="records" href="records.html">개인전적</a>
      <a data-page="matches" href="matches.html">상대전적</a>
      <a data-page="playlist" href="playlist.html">영상 재생</a>
      <a data-page="playlist-manager" href="playlist-manager.html">플레이리스트 관리</a>
      <button class="theme-button" onclick="toggleTheme()">🌙 모드</button>
    </nav>
  </header>

  <main class="page">
    <section class="home-simple">
      <div class="manager-wrap">
        <section class="manager-card">
          <h2>재생목록 관리</h2>

          <div class="form-row">
            <label for="playlistName">재생목록 이름</label>
            <input id="playlistName" placeholder="예) 캄몬스타즈 뮤비">
          </div>

          <div class="form-row">
            <label for="playlistOrder">우선순위</label>
            <input id="playlistOrder" type="number" value="1">
          </div>

          <div class="form-row">
            <label for="playlistPublic">공개 설정</label>
            <select id="playlistPublic">
              <option value="public">공개</option>
              <option value="private">비공개</option>
            </select>
          </div>

          <div class="btn-row">
            <button id="playlistSaveButton" class="manager-btn" onclick="savePlaylistToFirebase()">재생목록 저장</button>
            <button class="manager-btn gray" onclick="clearPlaylistForm()">입력 초기화</button>
          </div>

          <hr style="margin:22px 0; border:0; border-top:1px solid #e2e8f0;">
          <div id="playlistList" class="playlist-list"></div>
        </section>

        <section class="manager-card">
          <h2>영상 관리</h2>

          <div class="form-row">
            <label for="videoTitle">영상 제목</label>
            <input id="videoTitle" placeholder="예) My Time Is Now">
          </div>

          <div class="form-row">
            <label for="videoPlatform">플랫폼</label>
            <select id="videoPlatform">
              <option value="youtube">YouTube</option>
              <option value="soop">SOOP</option>
              <option value="streamable">Streamable</option>
              <option value="external">기타</option>
            </select>
          </div>

          <div class="form-row">
            <label for="videoPublic">공개 설정</label>
            <select id="videoPublic">
              <option value="public">공개</option>
              <option value="private">비공개</option>
            </select>
          </div>

          <div class="form-row">
            <label for="videoUrl">영상 URL</label>
            <input id="videoUrl" placeholder="YouTube / SOOP / Streamable / 기타 URL">
          </div>

          <div class="form-row">
            <label for="videoThumb">썸네일 URL</label>
            <input id="videoThumb" placeholder="비워두면 플랫폼 기본 썸네일 사용">
          </div>

          <div class="form-row">
            <label for="videoPlaylist">재생목록 선택</label>
            <select id="videoPlaylist"></select>
          </div>

          <div class="form-row">
            <label for="videoPriority">우선순위</label>
            <input id="videoPriority" type="number" value="1">
          </div>

          <div class="btn-row">
            <button id="videoSaveButton" class="manager-btn green" onclick="savePlaylistVideoToFirebase()">영상 추가</button>
            <button class="manager-btn gray" onclick="clearVideoForm()">입력 초기화</button>
          </div>

          <p class="small-info" style="margin-top:14px;">우선순위 숫자가 낮을수록 아래쪽에 표시됩니다. 예: 20, 15, 10, 5, 1</p>

          <hr style="margin:22px 0; border:0; border-top:1px solid #e2e8f0;">
          <div id="videoList" class="video-list"></div>
        </section>
      </div>
    </section>
  </main>
</div>

<div class="form-row">
  <label for="importJsonText">localStorage JSON 붙여넣기</label>
  <textarea
    id="importJsonText"
    rows="8"
    placeholder='{"playlists":[...]}'
  ></textarea>
</div>

<button class="manager-btn" onclick="importJsonTextToFirebase()">
  붙여넣은 JSON Firebase로 옮기기
</button>

<footer class="footer">
  <div class="footer-copy">© 2026 주니.킨콘. All Rights Reserved.</div>
  <div class="footer-links">
    <a href="https://www.sooplive.com/station/joony86" target="_blank" class="footer-icon"><img src="icons/soop-logo.png" alt="SOOP" /></a>
    <a href="https://www.youtube.com/@kinkonvv" target="_blank" class="footer-icon"><img src="icons/youtube-logo.png" alt="YouTube" /></a>
  </div>
</footer>

<script type="module" src="./playlist.js"></script>
<script src="./theme.js?v=3"></script>
</body>
</html>
