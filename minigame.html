  <style>
  .minigame-tabs{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:22px;
  }

  .minigame-tab{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    height:48px;
    padding:0 20px;
    border-radius:14px;
    text-decoration:none;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);
    color:#fff;
    font-size:15px;
    font-weight:1000;
    transition:.15s ease;
  }

  .minigame-tab:hover{
    transform:translateY(-2px);
    border-color:#00A2FF;
    box-shadow:0 12px 24px rgba(0,162,255,.18);
  }

  .minigame-tab.active{
    background:linear-gradient(135deg,#0458ff,#00a2ff);
    border-color:transparent;
    color:#fff;
    box-shadow:0 12px 26px rgba(0,162,255,.24);
  }

  .minigame-guide{
    margin-top:22px;
    padding:18px 20px;
    border-radius:18px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    color:rgba(255,255,255,.72);
    font-size:14px;
    line-height:1.6;
    font-weight:800;
    text-align:left;
  }

  .minigame-guide img{
    display:block;
    margin:0 auto;
    width:min(500px,100%);
    height:auto;
  }

  /* 라이트모드 대응: body.light / body.light-mode 둘 다 */
  body.light #page-minigame .section-title h2,
  body.light-mode #page-minigame .section-title h2{
    color:#0f172a !important;
  }

  body.light #page-minigame .section-title span,
  body.light-mode #page-minigame .section-title span{
    color:#334155 !important;
    opacity:1 !important;
    font-weight:900 !important;
  }

  body.light #page-minigame .minigame-tab,
  body.light-mode #page-minigame .minigame-tab{
    background:#ffffff !important;
    color:#0f172a !important;
    border:1px solid rgba(15,23,42,.14) !important;
    box-shadow:none !important;
  }

  body.light #page-minigame .minigame-tab:visited,
  body.light-mode #page-minigame .minigame-tab:visited{
    color:#0f172a !important;
  }

  body.light #page-minigame .minigame-tab:hover,
  body.light-mode #page-minigame .minigame-tab:hover{
    color:#0458ff !important;
    border-color:#00A2FF !important;
    box-shadow:0 12px 24px rgba(0,162,255,.14) !important;
  }

  body.light #page-minigame .minigame-tab.active,
  body.light-mode #page-minigame .minigame-tab.active{
    background:linear-gradient(135deg,#0458ff,#00a2ff) !important;
    color:#ffffff !important;
    border-color:transparent !important;
    box-shadow:0 12px 26px rgba(0,162,255,.22) !important;
  }

  body.light #page-minigame .minigame-tab.active:visited,
  body.light-mode #page-minigame .minigame-tab.active:visited{
    color:#ffffff !important;
  }

  body.light #page-minigame .minigame-guide,
  body.light-mode #page-minigame .minigame-guide{
    background:#eef4ff !important;
    border:1px solid #c7d7f5 !important;
    color:#334155 !important;
  }

  body.light #page-minigame .minigame-guide img,
  body.light-mode #page-minigame .minigame-guide img{
    filter:drop-shadow(0 12px 24px rgba(15,23,42,.12));
  }

  @media(max-width:768px){
    .minigame-tabs{
      display:grid;
      grid-template-columns:1fr 1fr;
    }

    .minigame-tab{
      width:100%;
      padding:0 10px;
      font-size:14px;
    }
  }
</style>
