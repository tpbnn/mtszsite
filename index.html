<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Match Intro Overlay</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>


.font-control{
  display:grid;
  grid-template-columns:1fr auto;
  gap:6px 12px;
  margin-top:10px;
  color:#dbeafe;
  font-size:12px;
  font-weight:900;
}

.font-control input{
  grid-column:1 / -1;
  width:100%;
  height:28px;
  padding:0;
}

.font-control span{
  justify-self:end;
  font-weight:950;
}

:root{
  --chroma:#00ff00;
  --bg:#030712;
  --line:rgba(255,255,255,.08);
  --text:#f8fafc;
  --muted:#94a3b8;
  --blue:#3b82f6;
  --red:#ef4444;
  --purple:#a855f7;
  --gold:#facc15;
  --name-font:39px;
--map-font:32px;
--vs-font:48px;
--score-font:44px;

--map-box-width:180px;
--map-box-height:58px;

}

*{box-sizing:border-box;}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  font-family:Pretendard, Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color:var(--text);
}

button,input{font-family:inherit;}

.app{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:16px;
  background:
    radial-gradient(circle at 15% 0%, rgba(59,130,246,.16), transparent 30%),
    radial-gradient(circle at 82% 12%, rgba(168,85,247,.12), transparent 32%),
    #030712;
}

.page-header{
  height:48px;
  flex:0 0 48px;
  display:flex;
  align-items:center;
  padding:0 12px 0 4px;
  gap:12px;
}

.page-title{
  display:inline-flex;
  align-items:center;
  gap:12px;
  height:48px;
  font-size:clamp(8px, 1vw, 25px);
  font-weight:950;
  letter-spacing:-.06em;
  line-height:1;
}

.title-logo{
  width:30px;
  height:30px;
  object-fit:contain;
  display:block;
  flex:0 0 auto;

   transform:translateY(4px);
}



.page-desc{
  color:var(--muted);
  font-size:clamp(8px, 1vw, 12px);
  font-weight:700;
  padding-right:10px;
  white-space:nowrap;
  margin-left:auto;
}

.main{
  min-height:0;
  flex:1;
  display:grid;
  grid-template-columns:minmax(760px,1fr) 390px;
  gap:16px;
}

/* PREVIEW */
.preview{
  position:relative;
  overflow:hidden;
  border-radius:0px;
  border:1px solid var(--line);
  background:
    radial-gradient(circle at 50% 10%, rgba(59,130,246,.12), transparent 34%),
    #070b14;
  box-shadow:0 24px 80px rgba(0,0,0,.36);
  transition:background .18s ease;
}

.preview.chroma{background:var(--chroma);}

.stage{
  position:absolute;
  left:50%;
  top:51%;
  transform:translate(-50%,-50%);
  width:min(1060px,92%);
  display:grid;
  grid-template-columns:320px minmax(230px,1fr) 320px;
  gap:38px;
  align-items:center;
}

.player-card{
  position:relative;
  overflow:hidden;
  border-radius:30px;
  background:
    linear-gradient(180deg, rgba(17,24,39,.95), rgba(7,11,20,.98));
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 22px 68px rgba(0,0,0,.46);
  transform:translateY(0) scale(1);
  opacity:1;
  will-change:transform,opacity,filter;
}

/* Reflection / glossy sweep: media layer above image/video */
.media::before{
  content:"";
  position:absolute;
  top:-35%;
  bottom:-35%;
  left:-90%;
  width:62%;
  z-index:4;
  pointer-events:none;
  background:
    linear-gradient(
      115deg,
      transparent 0%,
      transparent 30%,
      rgba(255,255,255,.05) 40%,
      rgba(255,255,255,.28) 50%,
      rgba(255,255,255,.08) 60%,
      transparent 72%,
      transparent 100%
    );
  opacity:0;
  transform:skewX(-14deg);
  mix-blend-mode:screen;
}

.stage.sequence .media::before{
  animation:reflectionSweep 4s cubic-bezier(.16,1,.3,1) 1.0s both;
}

@keyframes reflectionSweep{
  0%{left:-90%; opacity:0;}
  14%{opacity:.85;}
  72%{opacity:.75;}
  100%{left:130%; opacity:0;}
}

.media{
  position:relative;
  aspect-ratio:1/1;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 15%, color-mix(in srgb, var(--accent, var(--blue)) 26%, transparent), transparent 43%),
    linear-gradient(145deg,#1e293b,#0f172a);
}

.media img,.media video{
  position:relative;
  z-index:1;
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.media-placeholder{
  position:absolute;
  inset:0;
  z-index:1;
  display:grid;
  place-items:center;
  padding:54px;
}

.race-symbol{
  width:78%;
  height:78%;
  object-fit:contain;
  opacity:.86;
  filter:
    drop-shadow(0 0 20px color-mix(in srgb, var(--accent, var(--blue)) 70%, transparent))
    drop-shadow(0 0 46px rgba(255,255,255,.12));
}

.race-symbol-fallback{
  width:150px;
  height:150px;
  display:grid;
  place-items:center;
  border-radius:50%;
  color:var(--accent, var(--blue));
  font-size:92px;
  font-weight:950;
  background:rgba(255,255,255,.035);
  border:1px solid color-mix(in srgb, var(--accent, var(--blue)) 35%, transparent);
  box-shadow:0 0 40px color-mix(in srgb, var(--accent, var(--blue)) 24%, transparent);
}

.media::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:3;
  background:linear-gradient(to top, rgba(0,0,0,.72), transparent 45%);
  pointer-events:none;
}

.info{
  position:relative;
  z-index:2;
  padding:16px 18px;
  background:linear-gradient(90deg,rgba(7,11,20,.98),rgba(15,23,42,.98));
  border-top:2px solid var(--accent, var(--blue));
  transform-origin:center;
}

.race{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:11px;
  letter-spacing:.18em;
  font-weight:950;
}

.race-icon{
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  border-radius:8px;
  background:color-mix(in srgb, var(--accent, var(--blue)) 20%, rgba(255,255,255,.06));
  color:var(--accent, var(--blue));
  font-size:14px;
  font-weight:950;
}

.name-row{
  margin-top:8px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
}




.name{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  /* font-size:39px; */
  font-size:var(--name-font);

  line-height:.95;
  font-weight:950;
  letter-spacing:-.06em;
}

.match-title{
  margin:22px auto 0;

 width:var(--map-box-width);
height:var(--map-box-height);

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0 14px;
  border-radius:16px;
  background:rgba(0,0,0,.50);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(10px);

  /* font-size:32px; */

  font-size:var(--map-font);
  font-weight:950;
  letter-spacing:-.06em;
  line-height:1;

  white-space:nowrap;
  overflow:visible;
  text-overflow:clip;
  text-align:center;
  box-sizing:border-box;

  box-shadow:0 16px 40px rgba(0,0,0,.18);
}

.vs{
  position:relative;
  display:inline-block;

  /* font-size:48px; */
  font-size:var(--vs-font);
  line-height:.82;
  font-weight:1000;
  font-style:italic;
  letter-spacing:-0.08em;

  color:#f8fafc;

  text-shadow:
    0 0 10px rgba(255,255,255,.18),
    0 0 26px rgba(59,130,246,.16),
    0 0 46px rgba(168,85,247,.08);

  opacity:.98;

  will-change:transform,opacity,filter;
}

.score{
  flex:0 0 auto;
  /* font-size:44px; */
  font-size:var(--score-font);
  line-height:.9;
  font-weight:950;
}




.fit-text{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  width:100%;
  display:block;
}

.meta{
  margin-top:8px;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.center{
  text-align:center;
  will-change:transform,opacity,filter;
}



/* 뒤 오라 */
.vs::before{
  content:"";
  position:absolute;

  left:50%;
  top:50%;

  width:260px;
  height:260px;

  transform:translate(-50%,-50%);
  border-radius:50%;

  background:
    radial-gradient(
      rgba(59,130,246,.10),
      rgba(59,130,246,.03) 48%,
      transparent 72%
    );

  filter:blur(24px);

  z-index:-1;
  pointer-events:none;
}

@keyframes vsImpact{
  0%{
    opacity:0;
    transform:
      scale(.55)
      rotate(-6deg);

    filter:
      blur(10px)
      brightness(1.6);
  }

  55%{
    opacity:1;

    transform:
      scale(1.12)
      rotate(1deg);

    filter:
      blur(0)
      brightness(1.15);
  }

  100%{
    opacity:1;

    transform:
      scale(1)
      rotate(0);

    filter:
      brightness(1);
  }
}


/* intro auto sequence: 0.9s in / 2.8s hold / 0.6s out / about 4.5s total */
.stage.sequence .player-card.leftish{
  animation:impactLeft .9s cubic-bezier(.16,1,.3,1) 0s both,
            exitLeft .6s cubic-bezier(.7,0,.84,0) 3.7s forwards;
}
.stage.sequence .player-card.rightish{
  animation:impactRight .9s cubic-bezier(.16,1,.3,1) .06s both,
            exitRight .6s cubic-bezier(.7,0,.84,0) 3.7s forwards;
}
.stage.sequence .center{
  animation:centerImpact .82s cubic-bezier(.16,1,.3,1) .14s both,
            exitCenter .55s ease 3.65s forwards;
}
.stage.sequence .vs{
  animation:vsImpact .82s cubic-bezier(.2,1,.25,1) .22s both;
}
.stage.sequence .info{
  animation:infoPop .62s cubic-bezier(.16,1,.3,1) .44s both;
}

@keyframes impactLeft{
  0%{opacity:0;transform:translateX(-150px) scale(.86) rotateY(18deg);filter:blur(12px);}
  52%{opacity:1;transform:translateX(14px) scale(1.045) rotateY(-4deg);filter:blur(0);}
  76%{transform:translateX(-5px) scale(.992) rotateY(0);}
  100%{opacity:1;transform:translateX(0) scale(1);}
}
@keyframes impactRight{
  0%{opacity:0;transform:translateX(150px) scale(.86) rotateY(-18deg);filter:blur(12px);}
  52%{opacity:1;transform:translateX(-14px) scale(1.045) rotateY(4deg);filter:blur(0);}
  76%{transform:translateX(5px) scale(.992) rotateY(0);}
  100%{opacity:1;transform:translateX(0) scale(1);}
}
@keyframes centerImpact{
  0%{opacity:0;transform:scale(.72);filter:blur(10px);}
  60%{opacity:1;transform:scale(1.09);filter:blur(0);}
  100%{opacity:1;transform:scale(1);}
}
@keyframes vsImpact{
  0%{opacity:0;transform:scale(.3) rotate(-10deg);filter:blur(12px);}
  48%{opacity:1;transform:scale(1.26) rotate(3deg);filter:blur(0);}
  70%{transform:scale(.92) rotate(-1deg);}
  100%{opacity:1;transform:scale(1) rotate(0);}
}
@keyframes infoPop{
  0%{transform:translateY(24px);filter:brightness(.8);}
  60%{transform:translateY(-4px);filter:brightness(1.25);}
  100%{transform:translateY(0);filter:brightness(1);}
}
@keyframes exitLeft{to{opacity:0;transform:translateX(-180px) scale(.86) rotateY(-14deg);filter:blur(12px);}}
@keyframes exitRight{to{opacity:0;transform:translateX(180px) scale(.86) rotateY(14deg);filter:blur(12px);}}
@keyframes exitCenter{to{opacity:0;transform:scale(.68);filter:blur(14px);}}

/* SIDEBAR */

.sidebar{
  min-width:0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:18px;
  border-radius:28px;
  border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(10,14,24,.98),rgba(5,8,16,.98));
  box-shadow:0 24px 80px rgba(0,0,0,.34);
}

.sidebar-scroll{
  min-height:0;
  flex:1;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
  padding-right:4px;
}

.sidebar-scroll::-webkit-scrollbar{width:6px;}
.sidebar-scroll::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.16);
  border-radius:999px;
}

.section{
  padding:14px;
  border-radius:21px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.055);
}

.section-title{
  margin-bottom:10px;
  color:#dbeafe;
  font-size:11px;
  font-weight:950;
  letter-spacing:.15em;
}

.chroma-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 76px;
  gap:10px;
}

.chroma-toggle{
  margin-top:9px;
  width:100%;
}

.match-input{
  position:relative;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.input-wrap{
  position:relative;
  min-width:0;
}

.map-wrap,
.match-input button{
  grid-column:1 / -1;
}

input,button{
  min-width:0;
  height:43px;
  border-radius:14px;
  border:0;
  outline:0;
  padding:0 13px;
  font-size:14px;
  font-weight:850;
}

input{
  width:100%;
  color:#fff;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.075);
}

input::placeholder{color:rgba(148,163,184,.75);}

input:focus{
  border-color:rgba(59,130,246,.72);
  box-shadow:0 0 0 4px rgba(59,130,246,.14);
}

.suggest-box{
  display:none;
  position:absolute;
  top:48px;
  left:0;
  right:0;
  z-index:50;
  max-height:220px;
  overflow:auto;
  padding:6px;
  border-radius:14px;
  background:#0f172a;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 18px 50px rgba(0,0,0,.45);
}

.suggest-box.show{display:block;}

.suggest-item{
  padding:10px 12px;
  border-radius:10px;
  color:#e5e7eb;
  font-size:14px;
  font-weight:850;
  cursor:pointer;
}

.suggest-item:hover,
.suggest-item.active{
  background:rgba(59,130,246,.22);
  color:#fff;
}

button{
  cursor:pointer;
  color:#fff;
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  box-shadow:0 10px 22px rgba(37,99,235,.24);
  transition:.16s;
}

button:hover{
  filter:brightness(1.08);
  transform:translateY(-1px);
}

button:active{transform:translateY(0);}

button:disabled{
  opacity:.62;
  cursor:not-allowed;
  transform:none;
  filter:none;
}

.ghost{
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:none;
  color:#dbeafe;
}

.ghost.active{
  background:rgba(34,197,94,.14);
  border-color:rgba(34,197,94,.32);
  color:#86efac;
}

.match-list-section{
  flex:0 0 auto;
  min-height:auto;
  max-height:none;
}

.match-list{
  flex:0 0 auto;
  min-height:auto;
  max-height:none;

  overflow:visible;

  display:flex;
  flex-direction:column;
  gap:8px;

  padding-right:0;
}



.match{
  padding:10px;
  border-radius:16px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.055);
}

.match.active{
  border-color:rgba(59,130,246,.5);
  background:rgba(59,130,246,.08);
}

.match-line{
  display:flex;
  align-items:center;
  min-width:0;
  gap:8px;
}

.match-names{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
  font-weight:900;
  letter-spacing:-.03em;
}

.match-names .map-inline{
  color:var(--muted);
  font-weight:800;
}

.score-chip{
  margin-left:auto;
  color:#facc15;
  font-size:13px;
  font-weight:950;
}

.win-controls{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.win-name{
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  padding:6px 8px;
  border-radius:10px;
  font-size:12px;
  font-weight:950;
  text-align:center;
  background:rgba(255,255,255,.07);
  cursor:pointer;
}

.win-name.win{
  color:#052e16;
  background:linear-gradient(135deg,#22c55e,#bef264);
  box-shadow:0 0 16px rgba(34,197,94,.32);
}

.match-actions{
  margin-top:8px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.match-actions button{
  height:32px;
  border-radius:11px;
  font-size:12px;
}

.delete{
  color:#fda4af;
  background:rgba(251,113,133,.1);
  border:1px solid rgba(251,113,133,.18);
  box-shadow:none;
}

.output{
  flex:0 0 64px;
  height:64px;
  border-radius:21px;
  font-size:22px;
  font-weight:950;
}

@media(max-width:1280px){
  .main{grid-template-columns:1fr 370px;}
  .stage{
    width:min(940px,92%);
    grid-template-columns:285px minmax(200px,1fr) 285px;
    gap:28px;
  }
  /* .name{font-size:34px;}
  .vs{font-size:112px;}
  .match-title{font-size:28px;} */

  .name{font-size:var(--name-font);}
.vs{font-size:var(--vs-font);}
.match-title{font-size:var(--map-font);}
}



/* 가로세로모드 전환 버튼 추가 */
body.force-portrait .main{
  grid-template-columns:1fr;
  grid-template-rows:auto 1fr;
}

body.force-portrait .preview{
  min-height:420px;
  padding:clamp(42px, 8vw, 72px);
  display:flex;
  align-items:center;
  justify-content:center;
}

body.force-portrait .stage{
  position:relative;
  left:auto;
  top:auto;
  transform:none;
  width:100%;
  display:grid;
  grid-template-columns:minmax(0,1fr) clamp(70px,12vw,110px) minmax(0,1fr);
  gap:clamp(24px,5vw,28px);
  align-items:center;
  justify-items:center;
}

body.force-portrait .sidebar{
  overflow:visible;
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}

body.force-portrait .output{ order:1; }
body.force-portrait .chroma-section{ order:2; }
body.force-portrait .font-section{ order:3; }
body.force-portrait .input-section{ order:4; }
body.force-portrait .match-list-section{ order:5; }

body.force-portrait html,
body.force-portrait{
  height:auto;
  overflow-y:auto;
  overflow-x:hidden;
}

body.force-portrait .app{
  height:auto;
  min-height:100vh;
  overflow:visible;
}

body.force-portrait .player-card{
  width:100%;
  max-width:clamp(170px, 30vw, 260px);
  min-width:0;
  margin:0 auto;
  border-radius:24px;
}




@media (orientation: portrait), (max-width: 900px){

  html,body{
    height:auto;
    min-height:100%;
    overflow-y:auto;
    overflow-x:hidden;
  }

.match-title{
  width:var(--map-box-width);
  height:var(--map-box-height);
  padding:0 10px;
}

  /* .match-title{
    width:160px;
    height:44px;
    padding:0 10px;
  } */

  .app{
    height:auto;
    min-height:100vh;
    overflow:visible;
  }

  .main{
    overflow:visible;
  }

  .sidebar{
    overflow:visible;
  }


  .main{
    grid-template-columns:1fr;
    grid-template-rows:auto 1fr;
  }


  .output{ order:1; }
  .chroma-section{ order:2; }
  .font-section{ order:3; }
  .input-section{ order:4; }
  .match-list-section{ order:5; }

  .match-list-section{
    min-height:auto;
    max-height:none;
  }

  .match-list{
    overflow:visible;
    max-height:none;
  }


 .preview{
    min-height:420px;
    padding:clamp(42px, 8vw, 72px) clamp(42px, 8vw, 72px);
    border-radius:0px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

.stage{
  position:relative;
  left:auto;
  top:auto;
  transform:none;

  width:100%;
  display:grid;
  grid-template-columns:
    minmax(0, 1fr)
    clamp(70px, 12vw, 110px)

<body>
<div class="app">
  <header class="page-header">
    <div class="page-title">
      <img src="16bit.png" alt="16bit" class="title-logo" />
      <span>경기를 시자아아아아아아아아악~ 하겠습니다!</span>
    </div>
    <div class="page-desc">© 2026 주니.킨콘. All Rights Reserved. Designed for 비타밍♥.</div>

  </header>

  <main class="main">

          </div>
          <div class="info" id="infoA">
            <div class="race"><span class="race-icon" id="raceIconA">T</span><span id="raceA">TERRAN</span></div>
            <div class="name-row">
              <div class="name fit-text" id="nameA">선수A</div>
              <div class="score" id="scoreA">0</div>
            </div>
            <div class="meta fit-text" id="metaA">소속 · 티어</div>
          </div>
        </article>

        <section class="center" id="center">
          <div class="vs">VS</div>
          <div class="match-title" id="matchTitle">맵 이름</div>
        </section>

        <article class="player-card rightish" id="cardB">
          <div class="media" id="mediaB">
            <div class="media-placeholder"></div>
          </div>
          <div class="info" id="infoB">
            <div class="race"><span class="race-icon" id="raceIconB">Z</span><span id="raceB">ZERG</span></div>
            <div class="name-row">
              <div class="name fit-text" id="nameB">선수B</div>
              <div class="score" id="scoreB">0</div>
            </div>
            <div class="meta fit-text" id="metaB">소속 · 티어</div>
          </div>
        </article>
      </div>
    </section>

    <aside class="sidebar">
        <div class="sidebar-scroll">
<button class="output" id="outputBtn">출력하기</button>


      <section class="section chroma-section">
  <div class="section-title">CHROMA KEY (ex:#00ff00)</div>
        <div class="chroma-row">
          <input id="chromaInput" value="#00ff00">
          <button id="applyChromaBtn">적용</button>
        </div>
        <button class="ghost chroma-toggle" id="chromaToggleBtn">크로마키 OFF</button>
      </section>


      <!-- 폰트슬라이드 -->
      <section class="section font-section">
  <div class="section-title">FONT SIZE</div>

  <label class="font-control">
    선수 이름<span id="nameFontValue">39</span>
    <input type="range" id="nameFontRange" min="24" max="80" value="39">
  </label>

<label class="font-control">
  맵 이름 <span id="mapFontValue">32</span>
  <input type="range" id="mapFontRange" min="12" max="48" value="32">
</label>

  <label class="font-control">
    VS<span id="vsFontValue">48</span>
    <input type="range" id="vsFontRange" min="32" max="160" value="48">
  </label>

  <label class="font-control">
    스코어<span id="scoreFontValue">44</span>
    <input type="range" id="scoreFontRange" min="24" max="80" value="44">
  </label>
</section>

      


      <section class="section input-section">
  <div class="section-title">MATCH INPUT</div>
        <div class="match-input">
          <div class="input-wrap">
            <input id="inputA" placeholder="선수 A" autocomplete="off">
            <div class="suggest-box" id="suggestA"></div>
          </div>
          <div class="input-wrap">
            <input id="inputB" placeholder="선수 B" autocomplete="off">
            <div class="suggest-box" id="suggestB"></div>
          </div>
          <div class="input-wrap map-wrap">
            <input id="inputMap" placeholder="맵 이름">
          </div>
          <button id="addBtn">경기 추가</button>
        </div>
      </section>

      <section class="section match-list-section">
        <div class="section-title">MATCH LIST</div>
        <div class="match-list" id="matchList"></div>
      </section>
</div>

      
    </aside>
  </main>

<script>
const $ = id => document.getElementById(id);

const raceMap = {
  T:{label:'TERRAN', icon:'T', color:'#3b82f6', symbol:'t.png'},
  Z:{label:'ZERG', icon:'Z', color:'#a855f7', symbol:'z.png'},
  P:{label:'PROTOSS', icon:'P', color:'#facc15', symbol:'p.png'},
  R:{label:'STARCRAFT', icon:'', color:'#e5e7eb', symbol:'r.png'}
};

const state = {
  players:[],
  matches:[
 
  ],
  selectedIndex:0,
  chromaOn:false,
  running:false,
  timer:null
};

window.addEventListener('DOMContentLoaded', async ()=>{
  bindEvents();
  await loadTierXlsx();
  setupAutocomplete('inputA','suggestA');
  setupAutocomplete('inputB','suggestB');
  renderMatchList();
  applySelectedToOverlay();

// 폰트슬라이더
bindFontSlider('nameFontRange', '--name-font');
bindFontSlider('mapFontRange', '--map-font');
bindFontSlider('vsFontRange', '--vs-font');
bindFontSlider('scoreFontRange', '--score-font'); 


});

window.addEventListener('resize', ()=>{
  requestAnimationFrame(runAutoFit);
});

function bindEvents(){
  $('applyChromaBtn').addEventListener('click', applyChromaColor);
  $('chromaToggleBtn').addEventListener('click', toggleChroma);
  $('addBtn').addEventListener('click', addMatch);

$('modeToggleBtn').addEventListener('click', toggleForceMode);

  $('inputMap').addEventListener('keydown', e=>{
    if(e.key === 'Enter') addMatch();
  });

  document.addEventListener('click', e=>{
    if(!e.target.closest('.input-wrap')){
      hideSuggestions();
    }
  });

  $('outputBtn').addEventListener('click', ()=>{
    if(state.running) return;

    applySelectedToOverlay();
    playSequence();
  });
}

function toggleForceMode(){
  document.body.classList.toggle('force-portrait');

  const isPortrait = document.body.classList.contains('force-portrait');
  $('modeToggleBtn').textContent = isPortrait ? '가로모드' : '세로모드';

  requestAnimationFrame(runAutoFit);
}

// 폰트슬라이더
function bindFontSlider(inputId, cssVar){
  const input = $(inputId);
  if(!input) return;

  const valueEl = $(inputId.replace('Range', 'Value'));
input.addEventListener('input', ()=>{
  const value = Number(input.value);

  document.documentElement.style.setProperty(cssVar, value + 'px');

  if(inputId === 'mapFontRange'){
    document.documentElement.style.setProperty('--map-box-width', Math.round(value * 5.7) + 'px');
    document.documentElement.style.setProperty('--map-box-height', Math.round(value * 1.8) + 'px');
  }

  if(valueEl){
    valueEl.textContent = input.value;
  }

  requestAnimationFrame(runAutoFit);
});


  // input.addEventListener('input', ()=>{
  //   document.documentElement.style.setProperty(cssVar, input.value + 'px');

  //   if(valueEl){
  //     valueEl.textContent = input.value;
  //   }

  //   requestAnimationFrame(runAutoFit);
  // });
}


function applyChromaColor(){
  const color = $('chromaInput').value.trim() || '#00ff00';
  document.documentElement.style.setProperty('--chroma', color);
}

function toggleChroma(){
  state.chromaOn = !state.chromaOn;
  applyChromaColor();

  $('preview').classList.toggle('chroma', state.chromaOn);
  $('chromaToggleBtn').textContent = state.chromaOn ? '크로마키 ON' : '크로마키 OFF';
  $('chromaToggleBtn').classList.toggle('active', state.chromaOn);
}

async function loadTierXlsx(){
  try{
    const res = await fetch('tier.xlsx');
    if(!res.ok) return;

    const buffer = await res.arrayBuffer();
    const workbook = XLSX.read(buffer, {type:'array'});
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});

    state.players = rows.map(row=>({
      name:String(row['이름'] || '').trim(),
      team:String(row['소속'] || '').trim(),
      race:String(row['종족'] || '').trim().toUpperCase(),
      tier:String(row['티어'] || '').trim(),
      image:String(row['이미지값'] || '').trim(),
      video:String(row['영상값'] || '').trim()
    })).filter(p=>p.name);
  }catch(e){
    console.warn('tier.xlsx 읽기 실패:', e);
  }
}

function getPlayerNames(){
  return [...new Set(state.players.map(p=>p.name).filter(Boolean))];
}

function setupAutocomplete(inputId, suggestId){
  const input = $(inputId);
  const box = $(suggestId);

  input.addEventListener('input', ()=>{
    renderSuggestions(input, box);
  });

  input.addEventListener('focus', ()=>{
    renderSuggestions(input, box);
  });

  input.addEventListener('keydown', e=>{
    const items = [...box.querySelectorAll('.suggest-item')];
    const isOpen = box.classList.contains('show') && items.length > 0;
    let idx = items.findIndex(item => item.classList.contains('active'));

    if(e.key === 'ArrowDown' && isOpen){
      e.preventDefault();
      idx = (idx + 1) % items.length;
      setActive(items, idx);
      return;
    }

    if(e.key === 'ArrowUp' && isOpen){
      e.preventDefault();
      idx = idx <= 0 ? items.length - 1 : idx - 1;
      setActive(items, idx);
      return;
    }

    if(e.key === 'Enter'){
      if(isOpen && idx >= 0){
        e.preventDefault();
        input.value = items[idx].dataset.name;
        hideSuggestions();
      }
      return;
    }

    if(e.key === 'Tab'){
      hideSuggestions();
      return;
    }

    if(e.key === 'Escape'){
      hideSuggestions();
    }
  });
}

function renderSuggestions(input, box){
  const keyword = input.value.trim();
  box.innerHTML = '';

  if(!keyword){
    box.classList.remove('show');
    return;
  }

  const lower = keyword.toLowerCase();
  const matches = getPlayerNames()
    .filter(name => name.toLowerCase().includes(lower) || name.includes(keyword))
    .slice(0, 8);

  if(!matches.length){
    box.classList.remove('show');
    return;
  }

  matches.forEach((name, index)=>{
    const item = document.createElement('div');
    item.className = 'suggest-item' + (index === 0 ? ' active' : '');
    item.dataset.name = name;
    item.textContent = name;
    item.addEventListener('mousedown', e=>{
      e.preventDefault();
      input.value = name;
      hideSuggestions();
    });
    box.appendChild(item);
  });

  box.classList.add('show');
}

function setActive(items, idx){
  items.forEach(item=>item.classList.remove('active'));
  items[idx].classList.add('active');
  items[idx].scrollIntoView({block:'nearest'});
}

function hideSuggestions(){
  document.querySelectorAll('.suggest-box').forEach(box=>{
    box.classList.remove('show');
  });
}

function addMatch(){
  const a = $('inputA').value.trim();
  const b = $('inputB').value.trim();
  const map = $('inputMap').value.trim();

  if(!a || !b || !map){
    alert('선수 A, 선수 B, 맵 이름을 모두 입력하세요.');
    return;
  }

  state.matches.push({a,b,map,winner:null});
  state.selectedIndex = state.matches.length - 1;

  $('inputA').value = '';
  $('inputB').value = '';
  $('inputMap').value = '';

  renderMatchList();
  applySelectedToOverlay();
}

function renderMatchList(){
  const list = $('matchList');
  list.innerHTML = '';

  state.matches.forEach((match, index)=>{
    const score = getScoreForIndex(index);
    const el = document.createElement('div');
    el.className = 'match' + (index === state.selectedIndex ? ' active' : '');

    el.innerHTML = `
      <div class="match-line">
        <div class="match-names">
          ${escapeHtml(match.a)} vs ${escapeHtml(match.b)}
          <span class="map-inline"> | ${escapeHtml(match.map)}</span>
        </div>
        <span class="score-chip">${score.scoreA}:${score.scoreB}</span>
      </div>
      <div class="win-controls">
        <span class="win-name ${match.winner === 'a' ? 'win' : ''}" data-action="winA">${escapeHtml(match.a)}</span>
        <span class="win-name ${match.winner === 'b' ? 'win' : ''}" data-action="winB">${escapeHtml(match.b)}</span>
      </div>
      <div class="match-actions">
        <button data-action="select">선택</button>
        <button class="delete" data-action="delete">삭제</button>
      </div>
    `;

    el.addEventListener('click', e=>{
      const action = e.target.dataset.action;

      if(action === 'winA') toggleWinner(index, 'a');
      if(action === 'winB') toggleWinner(index, 'b');
      if(action === 'select') selectMatch(index);
      if(action === 'delete') deleteMatch(index);
    });

    list.appendChild(el);
  });
}

function selectMatch(index){
  state.selectedIndex = index;
  renderMatchList();
  applySelectedToOverlay();
}

function deleteMatch(index){
  state.matches.splice(index,1);
  state.selectedIndex = Math.max(0, Math.min(state.selectedIndex, state.matches.length - 1));

  renderMatchList();
  applySelectedToOverlay();
}

function toggleWinner(index, side){
  state.matches[index].winner = state.matches[index].winner === side ? null : side;
  renderMatchList();

  if(index === state.selectedIndex) applySelectedToOverlay();
}

function getScoreForIndex(index){
  let scoreA = 0;
  let scoreB = 0;

  for(let i=0; i<=index; i++){
    if(state.matches[i]?.winner === 'a') scoreA++;
    if(state.matches[i]?.winner === 'b') scoreB++;
  }

  return {scoreA, scoreB};
}

function findPlayer(name){
  return state.players.find(p=>p.name === name) || null;
}

function applySelectedToOverlay(){
  const match = state.matches[state.selectedIndex];
  if(!match){
    clearOverlay();
    return;
  }

  const score = getScoreForIndex(state.selectedIndex);

  applyPlayer('A', match.a, findPlayer(match.a), score.scoreA);
  applyPlayer('B', match.b, findPlayer(match.b), score.scoreB);

  $('matchTitle').textContent = match.map;

  requestAnimationFrame(runAutoFit);
}

function applyPlayer(side, fallbackName, player, score){
  const race = raceMap[player?.race] || raceMap.R;
  const color = race.color;

  $(`name${side}`).textContent = player?.name || fallbackName;
  $(`score${side}`).textContent = score;
  $(`race${side}`).textContent = race.label;
  $(`raceIcon${side}`).textContent = race.icon;
  $(`meta${side}`).textContent = player ? `${player.team || '소속 없음'} · ${player.tier || '티어 없음'}` : '';

  $(`info${side}`).style.setProperty('--accent', color);
  $(`media${side}`).style.setProperty('--accent', color);
  $(`raceIcon${side}`).style.color = color;

  renderMedia($(`media${side}`), player, race);

  requestAnimationFrame(runAutoFit);
}

function renderMedia(box, player, race){
  box.innerHTML = '';

  if(player?.video){
    const video = document.createElement('video');
    video.src = `assets/videos/${player.video}`;
    video.autoplay = true;
    video.loop = true;
    video.muted = true;
    video.playsInline = true;
    video.onerror = ()=>renderRaceSymbol(box, race);
    box.appendChild(video);
    return;
  }

  if(player?.image){
    const img = document.createElement('img');
    img.src = `assets/images/${player.image}`;
    img.onerror = ()=>renderRaceSymbol(box, race);
    box.appendChild(img);
    return;
  }

  renderRaceSymbol(box, race);
}

function renderRaceSymbol(box, race){
  box.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.className = 'media-placeholder';

  const img = document.createElement('img');
  img.className = 'race-symbol';

  // race.symbol이 파일명(r.png)이어도, 절대경로(/assets/images/r.png)여도 모두 대응
  img.src = race.symbol.startsWith('/') ? race.symbol : `assets/images/${race.symbol}`;
  img.alt = race.label;

  img.onerror = ()=>{
    wrap.innerHTML = `<div class="race-symbol-fallback">${race.icon}</div>`;
  };

  wrap.appendChild(img);
  box.appendChild(wrap);
}

function clearOverlay(){
  $('nameA').textContent = '선수A';
  $('nameB').textContent = '선수B';
  $('scoreA').textContent = '0';
  $('scoreB').textContent = '0';
  $('matchTitle').textContent = '맵 이름';

  requestAnimationFrame(runAutoFit);
}

function playSequence(){
  const stage = $('stage');

  clearTimeout(state.timer);
  state.running = true;
  $('outputBtn').disabled = true;
  $('outputBtn').textContent = '출력 중...';

  stage.classList.remove('sequence');
  void stage.offsetWidth;
  stage.classList.add('sequence');

  state.timer = setTimeout(()=>{
    stage.classList.remove('sequence');
    state.running = false;
    $('outputBtn').disabled = false;
    $('outputBtn').textContent = '출력하기';
  }, 4500);
}


function isPortraitMode(){
  return window.matchMedia('(orientation: portrait), (max-width: 900px)').matches;
}

function autoFitOneLine(el, max = 39, min = 18){
  if(!el) return;

  el.style.fontSize = max + 'px';

  while(
    (el.scrollWidth >= el.clientWidth - 6) &&
    parseFloat(el.style.fontSize) > min
  ){
    el.style.fontSize =
      (parseFloat(el.style.fontSize) - 0.5) + 'px';
  }
}

function runAutoFit(){
  // fitMapTitleToFiveChars();
// 주석 : 폰트 크기 
   // autoFitOneLine(document.getElementById('nameA'), 80, 22);
  // autoFitOneLine(document.getElementById('nameB'), 80, 22);
  autoFitOneLine(document.getElementById('metaA'), 13, 10);
  autoFitOneLine(document.getElementById('metaB'), 13, 10);
}


function escapeHtml(str){
  return String(str)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}
