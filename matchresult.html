<main id="page-matchresult" class="page">
  <section class="card panel match-result-wrap">

    <div class="section-title match-result-title">
      <div>
        <h2>경기 결과</h2>
        <span>캄몬스타즈 소속 결과만 반영됩니다.</span>
      </div>

      <button type="button" class="opponent-record-btn" onclick="openOpponentRecordModal()">
        상대별 전적
      </button>
    </div>

    <div class="match-tabs">
      <button class="active" onclick="setMatchTab('team')">팀 전적</button>
      <button onclick="setMatchTab('player')">선수별 전적</button>
    </div>

<div id="teamResultView" class="match-view active">

  <div id="teamStatsSummary" class="team-stats-summary"></div>

  <div class="match-filters">
    <div id="matchTypeFilter" class="type-filter"></div>

    <select id="matchResultFilter">
      <option value="all">전체</option>
      <option value="승">승리 경기</option>
      <option value="패">패배 경기</option>
    </select>
  </div>

  <div id="teamResultList" class="team-result-list"></div>
</div>

<div id="playerResultView" class="match-view">

  <div id="playerNameButtons" class="player-name-buttons"></div>

  <div id="playerStatsSummary" class="team-stats-summary"></div>

  <div id="playerResultArea"></div>
</div>

<div id="opponentRecordModal" class="opponent-record-modal" aria-hidden="true">
  <div class="opponent-record-backdrop" onclick="closeOpponentRecordModal()"></div>

  <div class="opponent-record-dialog" role="dialog" aria-modal="true" aria-labelledby="opponentRecordTitle">
    <div class="opponent-record-header">
      <div>
        <h3 id="opponentRecordTitle">상대별 전적</h3>
        <p>상대별 총 전적 / 대학대전 / 미니대전 / 대회전적입니다.</p>
      </div>

      <button type="button" class="opponent-record-close" onclick="closeOpponentRecordModal()" aria-label="닫기">×</button>
    </div>

    <div class="opponent-record-body">
      <div class="opponent-record-table-wrap">
        <table class="opponent-record-table">
          <thead>
            <tr>
              <th>상대</th>
              <th>총 전적</th>
              <th>대학대전</th>
              <th>미니대전</th>
              <th>대회전적</th>
            </tr>
          </thead>
          <tbody id="opponentRecordTableBody"></tbody>
        </table>
      </div>
    </div>
